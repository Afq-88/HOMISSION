<!--title:الهيكل التنظيمي — KPTC-->
<!--hero:kp-hero-->
<style>
.ot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.ot-q{position:relative;flex:1;min-width:230px;max-width:440px}.ot-q svg{position:absolute;inset-inline-start:14px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--kp-muted);pointer-events:none}
.ot-q input{width:100%;border:2px solid var(--kp-line);border-radius:14px;padding:11px 14px;padding-inline-start:42px;font:500 15px var(--f-body);outline:0;background:#fff}.ot-q input:focus{border-color:var(--kp-indigo);box-shadow:0 0 0 4px rgba(46,44,120,.1)}
.ot button.b{height:42px;border-radius:12px;border:1.5px solid var(--kp-line-2);background:#fff;color:var(--kp-indigo);font:700 13.5px var(--f-body);padding:0 16px;cursor:pointer;transition:.2s}.ot button.b:hover{background:var(--kp-indigo);color:#fff;border-color:var(--kp-indigo)}
.ot-lg{display:flex;gap:14px;flex-wrap:wrap;margin-inline-start:auto;font-size:12.5px;color:var(--kp-muted)}.ot-lg span{display:inline-flex;align-items:center;gap:6px}.ot-lg i{width:13px;height:13px;border-radius:4px;display:block}
.og2{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
.og2 main,.og2>div:first-child{min-width:0}
/* nodes */
.nd{position:relative;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;text-align:start;width:100%;padding:9px 12px;border-radius:14px;border:1.5px solid var(--kp-line-2);background:#fff;color:var(--kp-ink);font:700 13.5px/1.5 var(--f-body);cursor:pointer;transition:border-color .2s,box-shadow .2s,translate .2s,opacity .2s}
.nd:hover{border-color:var(--kp-indigo);translate:0 -1px;box-shadow:0 12px 22px -16px rgba(31,29,92,.7)}
.nd.sel{border-color:var(--kp-indigo);box-shadow:0 0 0 4px rgba(46,44,120,.14)}
.nd.hit{border-color:var(--kp-sign);box-shadow:0 0 0 4px rgba(255,201,60,.55)}.nd.dim{opacity:.3}
.nd .dt{width:11px;height:11px;border-radius:4px;background:#fff;border:2.5px solid #9C9AC9}
.nd .av{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:center 12%;border:2.5px solid var(--kp-sign);background:var(--kp-paper)}
.nd .t{display:grid;gap:0;min-width:0}.nd .t small{font-weight:600;font-size:12px;color:var(--kp-muted);overflow-wrap:anywhere}
.nd .t b{overflow-wrap:anywhere;font-weight:700}
.nd em{font-style:normal;font:700 11px var(--f-body);background:var(--kp-paper);border:1px solid var(--kp-line);color:var(--kp-indigo);border-radius:10px;padding:0 8px;margin-inline-start:6px;white-space:nowrap}
.nd.board{background:var(--kp-ink);border-color:var(--kp-ink);color:#fff}.nd.board small{color:#C9C7EE}.nd.board em{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.nd.ceo{background:var(--kp-sign);border-color:var(--kp-sign);padding:14px 16px;font-size:16px}.nd.ceo small{color:var(--kp-ink);opacity:.75}.nd.ceo .av{border-color:var(--kp-ink);width:54px;height:54px}
.nd.dep{background:linear-gradient(140deg,#3d3a96,#2E2C78);border-color:#2E2C78;color:#fff}.nd.dep small{color:#D7D5F0}.nd.dep em{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.nd.exe{border-color:var(--kp-indigo)}.nd.exe .dt{border-color:var(--kp-indigo);background:var(--kp-indigo)}
.nd.unit .dt{border-color:#CFCCBF}
.nd.stf{background:var(--kp-paper-2)}.nd.stf .dt{border-color:#CFCCBF;background:#CFCCBF}
.nd.cmt{background:#EFEEFB;border-style:dashed;border-color:#9C9AC9;color:var(--kp-indigo)}
/* bands */
.bn{margin-bottom:26px}
.bn>h3{display:flex;align-items:center;gap:10px;font:800 13.5px var(--f-body);color:var(--kp-muted);margin-bottom:12px}.bn>h3::before{content:"";width:22px;height:3px;background:var(--kp-sign);border-radius:2px}.bn>h3::after{content:"";flex:1;height:1px;background:var(--kp-line)}
.hd{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr);gap:14px;align-items:start}
.cm{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ub{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.dvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:18px}
.dv{background:#fff;border:1px solid var(--kp-line);border-radius:24px;overflow:hidden;box-shadow:0 20px 34px -30px rgba(31,29,92,.5)}
.dv>.dh{padding:14px;background:linear-gradient(140deg,#EFEEFB,#fff)}
.dv>.dh .nd{padding:12px 14px}
.dv>.dx{padding:6px 14px 16px;display:grid;gap:12px}
.dv .sd{display:grid;gap:7px;padding:10px;border-radius:16px;background:var(--kp-paper)}.dv .sd>b{font-size:11.5px;color:var(--kp-muted)}
.tr{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.tr ul{list-style:none;margin:6px 0 0;padding:0 16px 0 0;padding-inline-start:16px;padding-inline-end:0;margin-inline-start:14px;border-inline-start:3px solid #E3E1F5;display:grid;gap:7px}
.tr ul>li{position:relative}.tr ul>li::before{content:"";position:absolute;inset-inline-start:-16px;top:22px;width:13px;border-top:3px solid #E3E1F5}
.tr details>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}.tr details>summary::-webkit-details-marker{display:none}
.tr .cr{width:30px;height:30px;border-radius:10px;border:1.5px solid var(--kp-line-2);display:grid;place-items:center;color:var(--kp-indigo);transition:rotate .2s;background:#fff}.tr details[open]>summary .cr{rotate:180deg}.cr svg{width:14px;height:14px}
/* details card */
.dpc{position:sticky;top:96px;background:#fff;border:1px solid var(--kp-line);border-radius:24px;padding:22px;display:grid;gap:12px;box-shadow:0 24px 40px -32px rgba(31,29,92,.55)}
.dpc .ph{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:center 12%;border:3px solid var(--kp-sign);justify-self:center}
.dpc .ic{width:76px;height:76px;border-radius:50%;background:var(--kp-paper);display:grid;place-items:center;color:var(--kp-indigo);justify-self:center}.dpc .ic svg{width:32px;height:32px}
.dpc small{color:var(--kp-muted);font-weight:700;font-size:12px;text-align:center}
.dpc h3{font:800 19px/1.55 var(--f-display);color:var(--kp-indigo);text-align:center}
.dpc p{font-size:13.5px;color:var(--kp-ink);line-height:1.7}.dpc p.m{color:var(--kp-muted)}
.dpc .pt{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px;color:var(--kp-muted)}.dpc .pt span{background:var(--kp-paper);border-radius:10px;padding:1px 10px}
.dpc ul{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}.dpc li{font-size:12px;background:var(--kp-paper);border:1px solid var(--kp-line);border-radius:12px;padding:1px 10px}
.dpc .k{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dpc .k div{background:var(--kp-paper);border-radius:14px;padding:10px;text-align:center}.dpc .k b{display:block;font:800 22px var(--f-display);color:var(--kp-indigo)}.dpc .k span{font-size:11.5px;color:var(--kp-muted)}
.lbx{position:fixed;inset:0;z-index:3000;background:rgba(14,13,44,.8);display:none;place-items:center;padding:16px;overflow:auto}.lbx.on{display:grid}
.lbx img{max-width:min(1100px,100%);border-radius:14px;background:#fff;cursor:zoom-in}.lbx img.z{max-width:none;width:1800px;cursor:zoom-out}.lbx-x{position:fixed;top:14px;inset-inline-start:14px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;font-size:24px;cursor:pointer;z-index:2}
@media(max-width:1000px){.og2{grid-template-columns:1fr}.dpc{position:static}.hd{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.nd,.tr .cr{transition:none}}
</style>

<div class="kp-hero"><div class="w ph">
  <div class="kp-tag">عن الشركة</div>
  <h1>الهيكل التنظيمي</h1>
  <p>من مجلس الإدارة إلى كل إدارة ومكتب: اضغط أي وحدة لتعرف تبعيتها ومسؤولها والوحدات التابعة لها.</p>
</div></div>

<main><div class="w">
  <div class="ot">
    <div class="ot-q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.500"/><path d="m16 16 4 4"/></svg><input id="ogQ" type="search" placeholder="ابحث عن إدارة أو مكتب أو منصب أو اسم…" autocomplete="off" aria-label="بحث في الهيكل"></div>
    <button type="button" class="b" id="ogOpen">فتح الكل</button><button type="button" class="b" id="ogShut">طيّ الكل</button><button type="button" class="b" id="ogOrig">الصورة الأصلية للهيكل</button>
    <div class="ot-lg"><span><i style="background:#14133A"></i>المجلس</span><span><i style="background:#FFC93C"></i>الرئيس التنفيذي</span><span><i style="background:#3d3a96"></i>نائب الرئيس</span><span><i style="background:#fff;border:2px solid #2E2C78"></i>مدير تنفيذي</span><span><i style="background:#fff;border:2px solid #CFCCBF"></i>إدارة / مكتب</span><span><i style="background:#EFEEFB;border:2px dashed #9C9AC9"></i>لجنة</span></div>
  </div>
  <div class="og2">
    <div id="og"></div>
    <aside class="dpc" id="ogDp" aria-live="polite"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></svg></div><small>تفاصيل الوحدة</small><h3>اختر وحدة من الهيكل</h3><p class="m" style="text-align:center">تظهر هنا تبعيتها والوحدات التابعة لها وصاحب المنصب.</p></aside>
  </div>
</div></main>

<div class="lbx" id="lb"><button class="lbx-x" type="button" id="lbX" aria-label="إغلاق">×</button><img id="lbI" src="../assets/org-structure.jpg" alt="الهيكل التنظيمي لشركة النقل العام الكويتية (الصورة الأصلية)"></div>

<script>
(function(){
  /* the chart is data: units and people come from the studio ("الهيكل التنظيمي"), starting from the company's published chart */
  var K = window.KPTC, E = K.esc, LV = {board: 'مجلس الإدارة', ceo: 'الرئيس التنفيذي', dep: 'نائب الرئيس التنفيذي', exe: 'مدير تنفيذي', unit: 'إدارة / مكتب', cmt: 'لجنة / مكتب على مستوى المجلس', stf: 'مكتب أو إدارة ملحقة'};
  var og = document.getElementById('og'), dp = document.getElementById('ogDp'), sel = '', closed = {};
  var CARET = '<span class="cr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>';
  var side = function(u){ return u.lv === 'cmt' || u.lv === 'stf'; };
  function node(x){
    var p = K.orgPerson(x), im = K.orgImg(p), n = K.descendants(x.id).length;
    return '<button type="button" class="nd ' + (LV[x.lv] ? x.lv : 'unit') + '" data-id="' + x.id + '">' + (im ? '<img class="av" src="' + E(im) + '" alt="">' : '<i class="dt"></i>') + '<span class="t"><b>' + E(x.n) + (n ? '<em class="num" title="عدد الوحدات التابعة">' + n + '</em>' : '') + '</b>' + (p && p.n ? '<small>' + E(p.n) + '</small>' : '') + '</span></button>';
  }
  function tree(list){
    return '<ul class="tr">' + list.map(function(x){ var ks = K.kids(x.id);
      if (!ks.length) return '<li>' + node(x) + '</li>';
      return '<li><details data-id="' + x.id + '"' + (closed[x.id] ? '' : ' open') + '><summary>' + node(x) + CARET + '</summary>' + tree(ks) + '</details></li>'; }).join('') + '</ul>';
  }
  function division(x){
    var ks = K.kids(x.id), sd = ks.filter(side), mn = ks.filter(function(k){ return !side(k); });
    return '<section class="dv"><div class="dh">' + node(x) + '</div><div class="dx">' + (sd.length ? '<div class="sd"><b>مكاتب وإدارات ملحقة</b>' + sd.map(node).join('') + '</div>' : '') + (mn.length ? tree(mn) : '') + '</div></section>';
  }
  function draw(){
    var us = K.org().units, root = us.filter(function(u){ return !u.p; })[0];
    if (!root){ og.innerHTML = '<p style="color:var(--kp-muted)">لم يُنشأ الهيكل بعد.</p>'; return; }
    var kids = K.kids(root.id), cm = [], mains = kids.filter(function(k){ return k.lv !== 'cmt'; });
    kids.filter(function(k){ return k.lv === 'cmt'; }).forEach(function(c){ cm.push(c); K.descendants(c.id).forEach(function(d){ cm.push(d); }); });
    var html = '<div class="bn"><h3>المجلس واللجان</h3><div class="hd"><div>' + node(root) + '</div><div class="cm">' + cm.map(node).join('') + '</div></div></div>';
    mains.forEach(function(m){
      var ks = K.kids(m.id), sd = ks.filter(side), leaves = ks.filter(function(k){ return !side(k) && !K.kids(k.id).length; }), boxes = ks.filter(function(k){ return !side(k) && K.kids(k.id).length; });
      html += '<div class="bn"><h3>' + (m.lv === 'ceo' ? 'الإدارة التنفيذية' : 'تتبع المجلس') + '</h3><div style="max-width:520px">' + node(m) + '</div></div>';
      if (leaves.length || sd.length) html += '<div class="bn"><h3>إدارات ومكاتب تتبع «' + E(m.n) + '» مباشرة</h3><div class="ub">' + sd.concat(leaves).map(node).join('') + '</div></div>';
      if (boxes.length) html += '<div class="bn"><h3>القطاعات</h3><div class="dvs">' + boxes.map(division).join('') + '</div></div>';
    });
    og.innerHTML = html;
    if (sel && K.unit(sel)) mark(); else if (sel){ sel = ''; }
    filter();
  }
  var dpDefault = dp.innerHTML;
  function mark(){ [].forEach.call(document.querySelectorAll('.nd.sel'), function(b){ b.classList.remove('sel'); }); [].forEach.call(document.querySelectorAll('.nd[data-id="' + sel + '"]'), function(b){ b.classList.add('sel'); }); }
  var USER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></svg>';
  function show(x, scroll){
    sel = x.id; mark();
    var path = [], p = K.unit(x.p); while (p){ path.unshift(p.n); p = K.unit(p.p); }
    var subs = K.descendants(x.id), w = K.orgPerson(x), im = K.orgImg(w), cnt = K.unitStaff(x).length, direct = K.kids(x.id).length;
    dp.innerHTML = (im ? '<img class="ph" src="' + E(im) + '" alt="' + E(w.n) + '">' : '<div class="ic">' + USER + '</div>') +
      '<small>' + (LV[x.lv] || LV.unit) + '</small><h3>' + E(x.n) + '</h3>' + (w && w.n ? '<p style="text-align:center"><b>' + E(w.n) + '</b>' + (w.t && w.t !== x.n ? '<br><span class="m">' + E(w.t) + '</span>' : '') + '</p>' : '') + (x.d ? '<p>' + E(x.d) + '</p>' : '') +
      (path.length ? '<div class="pt"><b>يتبع:</b>' + path.map(function(n){ return '<span>' + E(n) + '</span>'; }).join('←') + '</div>' : '<p class="m">أعلى مستوى في الهيكل.</p>') +
      '<div class="k"><div><b class="num">' + direct + '</b><span>وحدات مباشرة</span></div><div><b class="num">' + cnt + '</b><span>موظفون مسجلون</span></div></div>' +
      (subs.length ? '<ul>' + subs.map(function(s){ return '<li>' + E(s.n) + '</li>'; }).join('') + '</ul>' : '');
    if (scroll && window.innerWidth <= 1000) dp.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('.nd'); if (!b) return; var u = K.unit(b.getAttribute('data-id'));
    if (u){ e.preventDefault(); show(u, true); }
  });
  document.addEventListener('toggle', function(e){ var d = e.target; if (d && d.tagName === 'DETAILS'){ var id = d.getAttribute('data-id'); if (id){ if (d.open) delete closed[id]; else closed[id] = 1; } } }, true);
  document.getElementById('ogOpen').onclick = function(){ closed = {}; [].forEach.call(og.querySelectorAll('details'), function(d){ d.open = true; }); };
  document.getElementById('ogShut').onclick = function(){ [].forEach.call(og.querySelectorAll('details'), function(d){ d.open = false; }); };
  var norm = function(s){ return String(s || '').replace(/[ً-ٟـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي'); };
  function filter(scroll){
    var q = norm(document.getElementById('ogQ').value).trim(), first = null;
    [].forEach.call(document.querySelectorAll('.nd'), function(b){ var x = K.unit(b.getAttribute('data-id')), w = K.orgPerson(x), t = norm(x.n + ' ' + (w ? w.n + ' ' + w.t : '')), hit = !!q && t.indexOf(q) > -1; b.classList.toggle('hit', hit); b.classList.toggle('dim', !!q && !hit);
      if (hit){ var d = b.closest('details'); while (d){ d.open = true; d = d.parentElement && d.parentElement.closest('details'); } if (!first) first = b; } });
    if (first && scroll) first.scrollIntoView({behavior: 'smooth', block: 'center'});
  }
  document.getElementById('ogQ').addEventListener('input', function(){ filter(true); });
  var lb = document.getElementById('lb'), li = document.getElementById('lbI');
  document.getElementById('ogOrig').onclick = function(){ lb.classList.add('on'); }; document.getElementById('lbX').onclick = function(){ lb.classList.remove('on'); li.classList.remove('z'); };
  li.onclick = function(){ li.classList.toggle('z'); }; lb.addEventListener('click', function(e){ if (e.target === lb){ lb.classList.remove('on'); li.classList.remove('z'); } });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ lb.classList.remove('on'); li.classList.remove('z'); } });
  draw(); K.onChange(draw);
  window.addEventListener('message', function(e){ var d = e.data || {}; if (d.kpOrg){ var u = K.unit(d.kpOrg); if (u){ show(u); var b = document.querySelector('.nd[data-id="' + u.id + '"]'); if (b) b.scrollIntoView({block: 'center', behavior: 'smooth'}); } } });
})();
</script>

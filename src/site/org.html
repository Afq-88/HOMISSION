<!--title:الهيكل التنظيمي — KPTC-->
<!--hero:kp-hero-->
<style>
.og-hd{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}
.og-q{position:relative;flex:1;min-width:240px;max-width:480px}
.og-q>svg{position:absolute;inset-inline-start:14px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--kp-muted);pointer-events:none}
.og-q input{width:100%;border:2px solid var(--kp-line);border-radius:14px;padding:11px 14px;padding-inline-start:42px;font:500 15px var(--f-body);outline:0;background:#fff;transition:.2s}
.og-q input:focus{border-color:var(--kp-indigo);box-shadow:0 0 0 4px rgba(46,44,120,.1)}
.og-res{position:absolute;z-index:30;inset-inline:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--kp-line);border-radius:16px;box-shadow:0 24px 40px -20px rgba(31,29,92,.5);overflow:hidden;display:none;max-height:340px;overflow-y:auto}
.og-res.on{display:block}
.og-res button{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;width:100%;text-align:start;background:#fff;border:0;border-bottom:1px solid var(--kp-line);padding:9px 14px;font:inherit;cursor:pointer}
.og-res button:last-child{border-bottom:0}.og-res button:hover,.og-res button.k{background:#EFEEFB}
.og-res img,.og-res i.d{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:center 12%;border:2px solid var(--kp-sign);background:var(--kp-paper)}
.og-res i.d{border:2px solid var(--kp-line-2);display:grid;place-items:center;font-style:normal;color:var(--kp-indigo);font-size:12px}
.og-res b{display:block;font-size:14px;color:var(--kp-ink)}.og-res small{color:var(--kp-muted);font-size:12px}
.og-res .no{padding:14px;color:var(--kp-muted);font-size:14px}
.seg2{display:inline-flex;background:#fff;border:1.5px solid var(--kp-line-2);border-radius:12px;padding:3px}
.seg2 button{border:0;background:none;font:700 13.5px var(--f-body);padding:7px 16px;border-radius:9px;cursor:pointer;color:var(--kp-muted)}
.seg2 button.on{background:var(--kp-indigo);color:#fff}
.og-b{height:42px;border-radius:12px;border:1.5px solid var(--kp-line-2);background:#fff;color:var(--kp-indigo);font:700 13.5px var(--f-body);padding:0 16px;cursor:pointer;transition:.2s}
.og-b:hover{background:var(--kp-indigo);color:#fff;border-color:var(--kp-indigo)}
.og-crumb{display:none;align-items:center;gap:8px;background:#FFF6D6;border:1.5px solid var(--kp-sign);border-radius:14px;padding:8px 14px;margin-bottom:12px;font-size:13.5px}
.og-crumb.on{display:flex}.og-crumb button{margin-inline-start:auto;border:0;background:var(--kp-ink);color:#fff;border-radius:10px;padding:5px 14px;font:700 12.5px var(--f-body);cursor:pointer}
/* the canvas */
.cvw{position:relative}
.cv{position:relative;height:clamp(520px,74vh,820px);border:1px solid var(--kp-line);border-radius:26px;overflow:hidden;background:#FAF9F4;background-image:radial-gradient(circle,rgba(46,44,120,.09) 1.3px,transparent 1.5px);background-size:24px 24px;touch-action:none;cursor:grab;user-select:none}
.cv.drag{cursor:grabbing}
#wd{position:absolute;left:0;top:0;transform-origin:0 0}
#wd.anim{transition:transform .38s cubic-bezier(.2,.7,.2,1)}
#wd>svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#wd>svg path{fill:none;stroke:#C4C2E6;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#wd>svg path.on{stroke:var(--kp-indigo);stroke-width:3.4}
.n{position:absolute;width:216px;height:86px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;text-align:start;padding:10px 12px;border-radius:18px;border:1.5px solid var(--kp-line-2);background:#fff;color:var(--kp-ink);font:700 13px/1.45 var(--f-body);cursor:pointer;box-shadow:0 14px 24px -20px rgba(31,29,92,.7);transition:box-shadow .2s,border-color .2s,opacity .2s}
.n:hover{border-color:var(--kp-indigo);box-shadow:0 20px 30px -18px rgba(31,29,92,.8)}
.n.sel{border-color:var(--kp-indigo);box-shadow:0 0 0 5px rgba(46,44,120,.16),0 20px 30px -18px rgba(31,29,92,.8)}
.n.hit{border-color:var(--kp-sign);box-shadow:0 0 0 5px rgba(255,201,60,.6)}.n.dim{opacity:.28}
.n .av{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:center 12%;border:2.5px solid var(--kp-sign);background:var(--kp-paper)}
.n .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--kp-paper);color:var(--kp-indigo)}.n .ic svg{width:22px;height:22px}
.n .t{display:grid;gap:1px;min-width:0}.n .t b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:800}
.n .t small{font-weight:600;font-size:11.5px;color:var(--kp-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n .vc{font-size:11px;font-weight:800;color:#B54708;background:#FFF1DB;border-radius:8px;padding:0 7px;justify-self:start}
.n.board{background:var(--kp-ink);border-color:var(--kp-ink);color:#fff}.n.board small{color:#C9C7EE}.n.board .ic{background:rgba(255,255,255,.1);color:var(--kp-sign)}
.n.ceo{background:var(--kp-sign);border-color:var(--kp-sign)}.n.ceo small{color:var(--kp-ink);opacity:.75}.n.ceo .av{border-color:var(--kp-ink)}.n.ceo .ic{background:rgba(20,19,58,.1);color:var(--kp-ink)}
.n.dep{background:linear-gradient(140deg,#3d3a96,#2E2C78);border-color:#2E2C78;color:#fff}.n.dep small{color:#D7D5F0}.n.dep .ic{background:rgba(255,255,255,.12);color:#fff}
.n.exe{border-color:var(--kp-indigo);border-width:2px}
.n.stf{background:var(--kp-paper-2)}
.n.cmt{background:#EFEEFB;border:2px dashed #9C9AC9;color:var(--kp-indigo);box-shadow:none}
.tg{position:absolute;z-index:2;min-width:30px;height:26px;padding:0 9px;border-radius:14px;border:2px solid var(--kp-indigo);background:#fff;color:var(--kp-indigo);font:800 12px var(--f-body);cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 14px -8px rgba(31,29,92,.8);transition:.15s}
.tg:hover{background:var(--kp-indigo);color:#fff}.tg.open{border-color:#B9B7DD;color:var(--kp-muted)}
.zc{position:absolute;inset-inline-start:14px;bottom:14px;display:grid;gap:6px;z-index:5}
.zc button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--kp-line-2);background:#fff;color:var(--kp-indigo);font:700 20px var(--f-body);cursor:pointer;box-shadow:0 8px 16px -10px rgba(31,29,92,.6)}.zc button:hover{background:var(--kp-indigo);color:#fff}
.zc button svg{width:18px;height:18px}
.hint{position:absolute;inset-inline-start:66px;bottom:20px;font-size:12px;color:var(--kp-muted);background:rgba(255,255,255,.85);border-radius:10px;padding:4px 10px;z-index:4;pointer-events:none}
/* the details sheet */
.sheet{position:absolute;z-index:8;inset-block:12px;inset-inline-end:12px;width:340px;background:#fff;border:1px solid var(--kp-line);border-radius:22px;box-shadow:0 30px 50px -26px rgba(31,29,92,.7);padding:20px;display:none;overflow-y:auto;cursor:default;user-select:text;touch-action:pan-y}
.sheet.on{display:grid;gap:12px;align-content:start;grid-auto-rows:max-content}
.sheet .x{position:absolute;top:10px;inset-inline-start:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--kp-paper);font-size:20px;cursor:pointer}
.sheet .ph{width:92px;height:92px;border-radius:50%;object-fit:cover;object-position:center 12%;border:3px solid var(--kp-sign);justify-self:center}
.sheet .ib{width:70px;height:70px;border-radius:22px;background:var(--kp-paper);display:grid;place-items:center;color:var(--kp-indigo);justify-self:center}.sheet .ib svg{width:30px;height:30px}
.sheet .lv{justify-self:center;font:700 12px var(--f-body);color:var(--kp-indigo);background:#EFEEFB;border-radius:10px;padding:2px 12px}
.sheet h3{font:800 19px/1.55 var(--f-display);color:var(--kp-indigo);text-align:center}
.sheet .who{text-align:center;font-size:14px}.sheet .who span{display:block;color:var(--kp-muted);font-size:13px}
.sheet p.d{font-size:13.5px;line-height:1.75;color:var(--kp-ink)}
.sheet .pt{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--kp-muted)}
.sheet .pt button{border:0;background:var(--kp-paper);border-radius:10px;padding:2px 10px;font:600 12px var(--f-body);cursor:pointer;color:var(--kp-indigo)}.sheet .pt button:hover{background:#EFEEFB}
.sheet .kk{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.sheet .kk div{background:var(--kp-paper);border-radius:14px;padding:9px 4px;text-align:center}.sheet .kk b{display:block;font:800 20px var(--f-display);color:var(--kp-indigo)}.sheet .kk span{font-size:11px;color:var(--kp-muted)}
.sheet h4{font:800 12.5px var(--f-body);color:var(--kp-muted);margin-top:2px}
.sheet .sl{display:grid;gap:5px}.sheet .sl button{text-align:start;border:1px solid var(--kp-line);background:#fff;border-radius:12px;padding:7px 12px;font:600 13px var(--f-body);cursor:pointer;color:var(--kp-ink)}.sheet .sl button:hover{border-color:var(--kp-indigo);background:#EFEEFB}
.sheet .go{border:0;background:var(--kp-indigo);color:#fff;border-radius:12px;padding:10px;font:700 13.5px var(--f-body);cursor:pointer}.sheet .go:hover{background:var(--kp-ink)}
/* list view */
.lt{display:none;background:#fff;border:1px solid var(--kp-line);border-radius:22px;padding:14px}
.lt ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}.lt ul ul{margin:6px 14px 4px 0;margin-inline-start:14px;margin-inline-end:0;padding-inline-start:14px;border-inline-start:3px solid #E3E1F5}
.lr{display:grid;grid-template-columns:30px 1fr;gap:6px;align-items:center}
.lr .cr{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--kp-line-2);background:#fff;color:var(--kp-indigo);cursor:pointer;display:grid;place-items:center;transition:rotate .2s;padding:0}.lr .cr svg{width:14px;height:14px}.lr .cr.open{rotate:180deg}.lr .cr.e{visibility:hidden}
.lr .n{position:relative;width:100%;height:auto;min-height:56px;box-shadow:none;border-radius:14px}
.on-list .cv{display:none}.on-list .lt{display:block}
.lgd{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--kp-muted)}.lgd span{display:inline-flex;align-items:center;gap:6px}.lgd i{width:13px;height:13px;border-radius:4px;display:block}
.lbx{position:fixed;inset:0;z-index:3000;background:rgba(14,13,44,.8);display:none;place-items:center;padding:16px;overflow:auto}.lbx.on{display:grid}
.lbx img{max-width:min(1100px,100%);border-radius:14px;background:#fff;cursor:zoom-in}.lbx img.z{max-width:none;width:1800px;cursor:zoom-out}.lbx-x{position:fixed;top:14px;inset-inline-start:14px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;font-size:24px;cursor:pointer;z-index:2}
.on-list .sheet{position:fixed;inset-block:auto 0;inset-inline:0;width:auto;max-height:68vh;border-radius:24px 24px 0 0;z-index:2500}
@media(max-width:900px){.sheet{position:fixed;inset-block:auto 0;inset-inline:0;width:auto;max-height:68vh;border-radius:24px 24px 0 0;z-index:2500}.cv{height:68vh}.hint{display:none}}
@media(prefers-reduced-motion:reduce){#wd.anim{transition:none}}
</style>

<div class="kp-hero"><div class="w ph">
  <div class="kp-tag">عن الشركة</div>
  <h1>الهيكل التنظيمي</h1>
  <p>مخطط حيّ لوحدات الشركة وتبعيتها. ابحث عن أي إدارة أو شخص، أو تجوّل في المخطط واضغط أي وحدة لتفاصيلها.</p>
</div></div>

<main><div class="w" id="ogRoot">
  <div class="og-hd">
    <div class="og-q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.500"/><path d="m16 16 4 4"/></svg><input id="ogQ" type="search" placeholder="ابحث عن إدارة أو مكتب أو منصب أو اسم…" autocomplete="off" aria-label="بحث في الهيكل"><div class="og-res" id="ogRes" role="listbox"></div></div>
    <div class="seg2" role="tablist" aria-label="طريقة العرض"><button type="button" data-v="chart" class="on">المخطط</button><button type="button" data-v="list">القائمة</button></div>
    <button type="button" class="og-b" id="ogAll">فتح كل الفروع</button><button type="button" class="og-b" id="ogMin">طيّ الفروع</button><button type="button" class="og-b" id="ogOrig">الصورة الأصلية</button>
  </div>
  <div class="og-crumb" id="ogFocus"><span id="ogFocusT"></span><button type="button" id="ogFocusX">عرض الهيكل كاملاً</button></div>
  <div class="cvw"><div class="cv" id="cv">
    <div id="wd"></div>
    <div class="zc"><button type="button" id="zIn" aria-label="تكبير">+</button><button type="button" id="zOut" aria-label="تصغير">−</button><button type="button" id="zFit" aria-label="ملاءمة الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
    <div class="hint">اسحب للتحرّك · Ctrl + العجلة أو قرص الأصابع للتكبير</div>
  </div>
  <aside class="sheet" id="sheet" aria-live="polite"></aside></div>
  <div class="lt" id="lt"></div>
  <div class="lgd"><span><i style="background:#14133A"></i>المجلس</span><span><i style="background:#FFC93C"></i>الرئيس التنفيذي</span><span><i style="background:#3d3a96"></i>نائب الرئيس</span><span><i style="background:#fff;border:2px solid #2E2C78"></i>مدير تنفيذي</span><span><i style="background:#fff;border:2px solid #CFCCBF"></i>إدارة / مكتب</span><span><i style="background:#EFEEFB;border:2px dashed #9C9AC9"></i>لجنة</span></div>
</div></main>

<div class="lbx" id="lb"><button class="lbx-x" type="button" id="lbX" aria-label="إغلاق">×</button><img id="lbI" src="../assets/org-structure.jpg" alt="الهيكل التنظيمي لشركة النقل العام الكويتية (الصورة الأصلية)"></div>

<script>
(function(){
  /* the chart is data: units and people come from the studio ("الهيكل التنظيمي") and follow decisions over time */
  var K = window.KPTC, E = K.esc;
  var LV = {board: 'مجلس الإدارة', ceo: 'الرئيس التنفيذي', dep: 'نائب الرئيس التنفيذي', exe: 'مدير تنفيذي', unit: 'إدارة / مكتب', cmt: 'لجنة / مكتب على مستوى المجلس', stf: 'مكتب أو إدارة ملحقة'};
  var NW = 216, NH = 86, GX = 22, GY = 70, DEF = 2;
  var cv = document.getElementById('cv'), wd = document.getElementById('wd'), sheet = document.getElementById('sheet'), lt = document.getElementById('lt'), rootEl = document.getElementById('ogRoot');
  var st = {s: 1, tx: 0, ty: 0}, closed = {}, sel = '', focus = '', view = innerWidth < 900 ? 'list' : 'chart', pos = {}, WW = 0, WH = 0, q = '';
  var side = function(u){ return u.lv === 'cmt' || u.lv === 'stf'; };
  function kidsOf(u){ var k = K.kids(u.id); return k.filter(function(x){ return !side(x); }).concat(k.filter(side)); }
  function rootU(){ var us = K.org().units; return (focus && K.unit(focus)) || us.filter(function(u){ return !u.p; })[0]; }
  var isClosed = function(u, d){ return closed[u.id] !== undefined ? closed[u.id] : d >= DEF; };
  var USER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></svg>';
  /* ---- layout: a tidy top-down tree, first child on the right (RTL) ---- */
  function build(u, d){
    var ks = kidsOf(u), n = {u: u, d: d, k: [], total: ks.length, grp: null};
    if (ks.length && !isClosed(u, d)){
      var all = ks.map(function(c){ return build(c, d + 1); }), st1 = all.filter(function(c){ return !c.k.length && !c.grp; });
      /* three or more units with nothing below them hang in one column instead of widening the chart */
      if (st1.length >= 3){ n.k = all.filter(function(c){ return c.k.length || c.grp; }); n.grp = {m: st1, w: NW + 30}; } else n.k = all;
    }
    var ws = n.k.map(function(c){ return c.w; }); if (n.grp) ws.push(n.grp.w);
    n.w = Math.max(NW, ws.reduce(function(a, c){ return a + c; }, 0) + GX * Math.max(0, ws.length - 1)); return n;
  }
  var MG = 12;
  function place(n, left, top, out){
    var cur = left, cs = [], items = n.k.map(function(c){ return {n: c, w: c.w}; }); if (n.grp) items.push({g: n.grp, w: n.grp.w});
    items.slice().reverse().forEach(function(it){
      if (it.n){ place(it.n, cur, top + NH + GY, out); cs.push(out[it.n.u.id].x + NW / 2); }
      else { var g = it.g; g.x = cur; g.y = top + NH + GY; g.sx = cur + NW + 14; g.m.forEach(function(m, i){ m.x = cur; m.y = g.y + i * (NH + MG); m.g = 1; out[m.u.id] = {x: m.x, y: m.y}; }); cs.push(g.sx); }
      cur += it.w + GX; });
    if (cs.length) n.x = (Math.min.apply(null, cs) + Math.max.apply(null, cs)) / 2 - NW / 2; else n.x = left + (n.w - NW) / 2;
    n.y = top; out[n.u.id] = {x: n.x, y: top};
  }
  var PAD = 40;
  function draw(keep){
    var root = rootU(); if (!root){ wd.innerHTML = ''; lt.innerHTML = '<p>لم يُنشأ الهيكل بعد.</p>'; return; }
    var before = keep && pos[keep] ? {x: pos[keep].x * st.s + st.tx, y: pos[keep].y * st.s + st.ty} : null;
    var tree = build(root, 0); pos = {}; place(tree, PAD, PAD, pos); WW = tree.w + PAD * 2;
    var maxY = 0, nodes = [], onp = ancestors(sel);
    (function walk(n){ nodes.push(n); maxY = Math.max(maxY, n.y); n.k.forEach(walk); if (n.grp) n.grp.m.forEach(function(m){ nodes.push(m); maxY = Math.max(maxY, m.y); }); })(tree); WH = maxY + NH + PAD + 14;
    var html = '<svg width="' + WW + '" height="' + WH + '"><path d="', hl = '';
    nodes.forEach(function(n){
      var hasG = n.grp, cx = n.k.map(function(c){ return c.x + NW / 2; }); if (hasG) cx.push(n.grp.sx); if (!cx.length) return;
      var pcx = n.x + NW / 2, py = n.y + NH, my = py + GY / 2;
      html += 'M' + pcx + ' ' + py + 'V' + my + 'M' + Math.min.apply(null, cx) + ' ' + my + 'H' + Math.max.apply(null, cx);
      n.k.forEach(function(c){ html += 'M' + (c.x + NW / 2) + ' ' + my + 'V' + c.y; if (onp[c.u.id]) hl += 'M' + pcx + ' ' + py + 'V' + my + 'H' + (c.x + NW / 2) + 'V' + c.y; });
      if (hasG){ var g = n.grp, last = g.m[g.m.length - 1]; html += 'M' + g.sx + ' ' + my + 'V' + (last.y + NH / 2); g.m.forEach(function(m){ html += 'M' + g.sx + ' ' + (m.y + NH / 2) + 'H' + (m.x + NW); if (onp[m.u.id]) hl += 'M' + pcx + ' ' + py + 'V' + my + 'H' + g.sx + 'V' + (m.y + NH / 2) + 'H' + (m.x + NW); }); }
    });
    html += '"/>' + (hl ? '<path class="on" d="' + hl + '"/>' : '') + '</svg>';
    nodes.forEach(function(n){ html += node(n.u, 'left:' + n.x + 'px;top:' + n.y + 'px');
      if (n.total){ var open = n.k.length > 0 || !!n.grp; html += '<button type="button" class="tg' + (open ? ' open' : '') + '" data-tg="' + n.u.id + '" style="left:' + (n.g ? n.x - 15 : n.x + NW / 2 - 15) + 'px;top:' + (n.g ? n.y + NH / 2 - 13 : n.y + NH - 13) + 'px" aria-label="' + (open ? 'طيّ' : 'فتح') + ' الفروع">' + (open ? '−' : '+' + K.descendants(n.u.id).length) + '</button>'; } });
    wd.style.width = WW + 'px'; wd.style.height = WH + 'px'; wd.innerHTML = html;
    if (before){ st.tx = before.x - pos[keep].x * st.s; st.ty = before.y - pos[keep].y * st.s; apply(false); }
    paintList(); mark(); filter(); crumb();
  }
  function node(u, style){
    var p = K.orgPerson(u), im = K.orgImg(p);
    return '<button type="button" class="n ' + (LV[u.lv] ? u.lv : 'unit') + (u.id === sel ? ' sel' : '') + '" data-id="' + u.id + '"' + (style ? ' style="' + style + '"' : '') + '>' + (im ? '<img class="av" src="' + E(im) + '" alt="">' : '<span class="ic">' + USER + '</span>') + '<span class="t"><b>' + E(u.n) + '</b>' + (u.vacant ? '<span class="vc">المنصب شاغر</span>' : (p && p.n ? '<small>' + E(p.n) + '</small>' : '')) + '</span></button>';
  }
  function ancestors(id){ var o = {}, u = K.unit(id); while (u){ o[u.id] = 1; u = K.unit(u.p); } return o; }
  /* ---- pan and zoom ---- */
  function apply(anim){ wd.classList.toggle('anim', !!anim); wd.style.transform = 'translate(' + st.tx + 'px,' + st.ty + 'px) scale(' + st.s + ')'; }
  function fit(anim, hard){ var W = cv.clientWidth, H = cv.clientHeight, full = Math.min(1, (W - 20) / WW, (H - 20) / WH * 1.4); st.s = hard ? Math.max(.3, full) : Math.max(.62, full);
    if (WW * st.s <= W) st.tx = (W - WW * st.s) / 2; else { var r = pos[rootU().id]; st.tx = W / 2 - (r.x + NW / 2) * st.s; } st.ty = 10; apply(anim); }
  function zoom(f, cx, cy){ var s2 = Math.max(.3, Math.min(1.8, st.s * f)); cx = cx == null ? cv.clientWidth / 2 : cx; cy = cy == null ? cv.clientHeight / 2 : cy; st.tx = cx - (cx - st.tx) * (s2 / st.s); st.ty = cy - (cy - st.ty) * (s2 / st.s); st.s = s2; apply(false); }
  function center(id, anim){ var p = pos[id]; if (!p) return; var W = cv.clientWidth - (sheet.classList.contains('on') && innerWidth > 900 ? 370 : 0), H = cv.clientHeight; st.s = Math.max(st.s, .7); st.tx = (innerWidth > 900 && sheet.classList.contains('on') ? 370 : 0) + W / 2 - (p.x + NW / 2) * st.s; st.ty = H / 2 - (p.y + NH / 2) * st.s; apply(anim !== false); }
  var ptr = {}, moved = false, dragging = false, startPt = null, pinch = 0;
  cv.addEventListener('pointerdown', function(e){ if (e.target.closest('.sheet,.zc')) return; ptr[e.pointerId] = {x: e.clientX, y: e.clientY}; startPt = {x: e.clientX, y: e.clientY, tx: st.tx, ty: st.ty}; moved = false; var ks = Object.keys(ptr); if (ks.length === 2) pinch = Math.hypot(ptr[ks[0]].x - ptr[ks[1]].x, ptr[ks[0]].y - ptr[ks[1]].y); });
  cv.addEventListener('pointermove', function(e){
    if (!ptr[e.pointerId]) return; ptr[e.pointerId] = {x: e.clientX, y: e.clientY}; var ks = Object.keys(ptr);
    if (ks.length === 2){ var d = Math.hypot(ptr[ks[0]].x - ptr[ks[1]].x, ptr[ks[0]].y - ptr[ks[1]].y), r = cv.getBoundingClientRect(); if (pinch) zoom(d / pinch, (ptr[ks[0]].x + ptr[ks[1]].x) / 2 - r.left, (ptr[ks[0]].y + ptr[ks[1]].y) / 2 - r.top); pinch = d; moved = true; return; }
    var dx = e.clientX - startPt.x, dy = e.clientY - startPt.y;
    if (!dragging && Math.abs(dx) + Math.abs(dy) > 6){ dragging = true; moved = true; cv.classList.add('drag'); try { cv.setPointerCapture(e.pointerId); } catch(x){} }
    if (dragging){ st.tx = startPt.tx + dx; st.ty = startPt.ty + dy; apply(false); }
  });
  function up(e){ delete ptr[e.pointerId]; pinch = 0; if (!Object.keys(ptr).length){ dragging = false; cv.classList.remove('drag'); } else { var k = Object.keys(ptr)[0]; startPt = {x: ptr[k].x, y: ptr[k].y, tx: st.tx, ty: st.ty}; } }
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', function(e){ if (!(e.ctrlKey || e.metaKey)) return; e.preventDefault(); var r = cv.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top); }, {passive: false});
  document.getElementById('zIn').onclick = function(){ zoom(1.2); }; document.getElementById('zOut').onclick = function(){ zoom(1 / 1.2); }; document.getElementById('zFit').onclick = function(){ fit(true, true); };
  window.addEventListener('resize', function(){ if (view === 'chart') fit(false); });
  /* ---- selection, details, focus ---- */
  function mark(){ [].forEach.call(document.querySelectorAll('.n.sel'), function(b){ b.classList.remove('sel'); }); [].forEach.call(document.querySelectorAll('.n[data-id="' + sel + '"]'), function(b){ b.classList.add('sel'); }); }
  function show(u){
    sel = u.id; var path = [], p = K.unit(u.p); while (p){ path.unshift(p); p = K.unit(p.p); }
    var w = K.orgPerson(u), im = K.orgImg(w), ks = K.kids(u.id), all = K.descendants(u.id).length, cnt = K.unitStaff(u).length;
    sheet.innerHTML = '<button type="button" class="x" data-close aria-label="إغلاق">×</button>' + (im ? '<img class="ph" src="' + E(im) + '" alt="' + E(w.n) + '">' : '<div class="ib">' + USER + '</div>') +
      '<span class="lv">' + (LV[u.lv] || LV.unit) + '</span><h3>' + E(u.n) + '</h3>' +
      (u.vacant ? '<p class="who"><b style="color:#B54708">المنصب شاغر حالياً</b></p>' : (w && w.n ? '<p class="who"><b>' + E(w.n) + '</b>' + (w.t && w.t !== u.n ? '<span>' + E(w.t) + '</span>' : '') + (w.since ? '<span>منذ ' + E(K.date(w.since)) + '</span>' : '') + '</p>' : '')) +
      (u.d ? '<p class="d">' + E(u.d) + '</p>' : '') +
      (path.length ? '<div class="pt"><b>يتبع:</b>' + path.map(function(x){ return '<button type="button" data-go="' + x.id + '">' + E(x.n) + '</button>'; }).join('›') + '</div>' : '<p class="d" style="color:var(--kp-muted)">أعلى مستوى في الهيكل.</p>') +
      '<div class="kk"><div><b class="num">' + ks.length + '</b><span>وحدات مباشرة</span></div><div><b class="num">' + all + '</b><span>إجمالي التابعة</span></div><div><b class="num">' + cnt + '</b><span>موظفون</span></div></div>' +
      (ks.length ? '<h4>الوحدات التابعة</h4><div class="sl">' + ks.map(function(k){ return '<button type="button" data-go="' + k.id + '">' + E(k.n) + '</button>'; }).join('') + '</div>' : '') +
      (ks.length && u.id !== focus ? '<button type="button" class="go" data-focus="' + u.id + '">تركيز المخطط على هذا الفرع</button>' : '');
    sheet.classList.add('on'); mark(); draw(); sheet.scrollTop = 0;
  }
  function closeSheet(){ sheet.classList.remove('on'); sel = ''; mark(); draw(); }
  /* open every ancestor so a unit is visible, then show it */
  function reveal(id){
    var u = K.unit(id); if (!u) return; var r = rootU(), a = ancestors(id); if (!a[r.id]){ focus = ''; r = rootU(); }
    var p = K.unit(u.p); while (p && p.id !== r.id){ closed[p.id] = false; p = K.unit(p.p); } if (r.id !== u.id) closed[r.id] = false;
    if (view === 'list') listOpen(id);
    show(u); if (view === 'chart') setTimeout(function(){ center(id, true); }, 30);
  }
  function crumb(){ var b = document.getElementById('ogFocus'), f = focus && K.unit(focus); b.classList.toggle('on', !!f); if (f) document.getElementById('ogFocusT').innerHTML = 'يُعرض الآن فرع: <b>' + E(f.n) + '</b>'; }
  /* ---- list view (small screens) ---- */
  var lopen = {};
  function listOpen(id){ var p = K.unit(K.unit(id) && K.unit(id).p); while (p){ lopen[p.id] = 1; p = K.unit(p.p); } }
  function lrow(u, d){ var ks = kidsOf(u), op = lopen[u.id] !== undefined ? lopen[u.id] : d < 1;
    return '<li><div class="lr"><button type="button" class="cr' + (op ? ' open' : '') + (ks.length ? '' : ' e') + '" data-lo="' + u.id + '" aria-label="فتح/طيّ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>' + node(u) + '</div>' + (ks.length && op ? '<ul>' + ks.map(function(k){ return lrow(k, d + 1); }).join('') + '</ul>' : '') + '</li>'; }
  function paintList(){ if (view !== 'list') return; var r = rootU(); lt.innerHTML = r ? '<ul>' + lrow(r, 0) + '</ul>' : ''; }
  /* ---- search ---- */
  var norm = function(s){ return String(s || '').replace(/[ً-ٟـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').toLowerCase(); };
  function hits(){ var t = norm(q).trim(); if (!t) return []; return K.org().units.filter(function(u){ var w = K.orgPerson(u); return norm(u.n + ' ' + (w ? w.n + ' ' + w.t : '') + ' ' + (u.d || '')).indexOf(t) > -1; }); }
  function filter(){
    var h = hits(), ids = {}; h.forEach(function(u){ ids[u.id] = 1; });
    [].forEach.call(document.querySelectorAll('.n'), function(b){ var i = b.getAttribute('data-id'); b.classList.toggle('hit', !!ids[i]); b.classList.toggle('dim', !!q.trim() && !ids[i]); });
  }
  var res = document.getElementById('ogRes');
  function results(){
    var h = hits().slice(0, 8); if (!q.trim()){ res.classList.remove('on'); return; }
    res.innerHTML = h.length ? h.map(function(u){ var w = K.orgPerson(u), im = K.orgImg(w), p = K.unit(u.p); return '<button type="button" data-go="' + u.id + '">' + (im ? '<img src="' + E(im) + '" alt="">' : '<i class="d">◧</i>') + '<span><b>' + E(u.n) + '</b><small>' + E((w && w.n ? w.n + ' · ' : '') + (p ? 'يتبع ' + p.n : 'أعلى مستوى')) + '</small></span></button>'; }).join('') : '<div class="no">لا نتائج مطابقة.</div>';
    res.classList.add('on');
  }
  document.getElementById('ogQ').addEventListener('input', function(){ q = this.value; results(); filter(); });
  document.getElementById('ogQ').addEventListener('keydown', function(e){ if (e.key === 'Enter'){ var h = hits()[0]; if (h){ res.classList.remove('on'); reveal(h.id); } } if (e.key === 'Escape'){ res.classList.remove('on'); } });
  /* ---- events ---- */
  document.addEventListener('click', function(e){
    var t = e.target;
    if (!t.closest('.og-q')) res.classList.remove('on');
    var g = t.closest('[data-go]'); if (g){ res.classList.remove('on'); reveal(g.getAttribute('data-go')); return; }
    var f = t.closest('[data-focus]'); if (f){ focus = f.getAttribute('data-focus'); closed = {}; sel = focus; show(K.unit(focus)); fit(false); return; }
    if (t.closest('[data-close]')){ closeSheet(); return; }
    var tg = t.closest('[data-tg]'); if (tg){ var id = tg.getAttribute('data-tg'), u = K.unit(id); closed[id] = tg.classList.contains('open'); draw(id); return; }
    var lo = t.closest('[data-lo]'); if (lo){ var i2 = lo.getAttribute('data-lo'); lopen[i2] = !lo.classList.contains('open'); paintList(); return; }
    var n = t.closest('.n'); if (n && !moved){ var u2 = K.unit(n.getAttribute('data-id')); if (u2){ show(u2); if (view === 'chart' && innerWidth > 900) center(u2.id, true); } }
  });
  [].forEach.call(document.querySelectorAll('.seg2 button'), function(b){ b.onclick = function(){ view = b.getAttribute('data-v'); [].forEach.call(document.querySelectorAll('.seg2 button'), function(x){ x.classList.toggle('on', x === b); }); rootEl.classList.toggle('on-list', view === 'list'); if (view === 'list') paintList(); else setTimeout(function(){ fit(false); }, 20); }; });
  function setAll(open){ closed = {}; K.org().units.forEach(function(u){ closed[u.id] = !open; }); if (!open){ var r = rootU(); closed[r.id] = false; kidsOf(r).forEach(function(k){ closed[k.id] = true; }); } lopen = {}; K.org().units.forEach(function(u){ lopen[u.id] = open; }); draw(); setTimeout(function(){ fit(true); }, 20); }
  document.getElementById('ogAll').onclick = function(){ setAll(true); }; document.getElementById('ogMin').onclick = function(){ setAll(false); };
  document.getElementById('ogFocusX').onclick = function(){ focus = ''; closed = {}; draw(); setTimeout(function(){ fit(true); }, 20); };
  var lb = document.getElementById('lb'), li = document.getElementById('lbI');
  document.getElementById('ogOrig').onclick = function(){ lb.classList.add('on'); }; document.getElementById('lbX').onclick = function(){ lb.classList.remove('on'); li.classList.remove('z'); };
  li.onclick = function(){ li.classList.toggle('z'); }; lb.addEventListener('click', function(e){ if (e.target === lb){ lb.classList.remove('on'); li.classList.remove('z'); } });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ lb.classList.remove('on'); li.classList.remove('z'); if (sheet.classList.contains('on')) closeSheet(); } });
  rootEl.classList.toggle('on-list', view === 'list'); [].forEach.call(document.querySelectorAll('.seg2 button'), function(x){ x.classList.toggle('on', x.getAttribute('data-v') === view); });
  draw(); fit(false); K.onChange(function(){ draw(); });
  /* arriving from the board page or the studio with a unit to show */
  try { var want = sessionStorage.getItem('kptc.orgFocus'); if (want){ sessionStorage.removeItem('kptc.orgFocus'); setTimeout(function(){ reveal(want); }, 200); } } catch(x){}
  window.addEventListener('message', function(e){ var d = e.data || {}; if (d.kpOrg && K.unit(d.kpOrg)) reveal(d.kpOrg); });
})();

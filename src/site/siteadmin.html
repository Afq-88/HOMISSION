<!--title:مركز إدارة الموقع — KPTC-->
<!--chrome:admin-->
<style>
body{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--kp-ink);color:#fff;position:sticky;top:0;height:100vh;overflow:auto;padding-bottom:20px}
.ab{display:flex;gap:10px;align-items:center;padding:16px;border-bottom:1px solid rgba(255,255,255,.1)}
.ab .kp-mark{width:38px;height:38px}.ab b{letter-spacing:.14em;direction:ltr}.ab small{display:block;color:#A9A7C9;font-size:11.5px}
aside h4{font:600 11.5px var(--f-body);color:#8E8CB8;padding:16px 16px 6px}
aside button{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-right:4px solid transparent;color:#C9C8E6;padding:10px 16px;font:500 14px var(--f-body);cursor:pointer;text-align:right}
aside button:hover{background:rgba(255,255,255,.05);color:#fff}
aside button.on{background:rgba(255,201,60,.1);color:#fff;border-right-color:var(--kp-sign);font-weight:700}
aside button em{font-style:normal;font-size:11px;font-weight:700;background:var(--kp-sign);color:var(--kp-ink);border-radius:2px;padding:0 6px}
.mn{padding:26px 30px 60px;min-width:0}
.mh{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.mh h1{font-size:26px}.mh p{color:var(--kp-muted)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--kp-line);background:#fff}
.row:last-child{border:0}.row b{display:block}.row small{color:var(--kp-muted)}
.sw{position:relative;width:50px;height:28px;border-radius:20px;background:var(--kp-line-2);border:0;cursor:pointer;transition:background .25s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .25s var(--kp-ease);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--kp-ok)}.sw.on::after{right:25px}
.kp4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kp4 div{background:#fff;border:1px solid var(--kp-line);border-top:3px solid var(--kp-indigo);border-radius:4px;padding:14px 16px}
.kp4 b{display:block;font:700 26px/1.2 var(--f-display);color:var(--kp-indigo)}.kp4 span{font-size:12.5px;color:var(--kp-muted)}
td .btn{margin-inline-end:4px}
select.s{border:1.5px solid var(--kp-line-2);border-radius:4px;padding:5px 8px;font:600 13px var(--f-body);background:#fff}
@media(max-width:900px){body{grid-template-columns:1fr}aside{position:static;height:auto}aside nav{display:flex;overflow-x:auto}aside h4{display:none}aside button{white-space:nowrap;border-right:0;border-bottom:4px solid transparent}aside button.on{border-bottom-color:var(--kp-sign)}.kp4{grid-template-columns:1fr 1fr}.mn{padding:18px 14px 50px}}
</style>
<aside>
  <div class="ab"><div class="kp-mark"></div><div><b>KPTC</b><small>مركز إدارة الموقع</small></div></div>
  <nav id="nav"></nav>
</aside>
<div class="mn">
  <div class="mh"><div><h1 id="hT"></h1><p id="hD"></p></div><div id="hA"></div></div>
  <div id="view"></div>
</div>
<div class="dlg" id="dlg"><div><button class="x" type="button" data-close>×</button><h3 id="dT"></h3><form class="form" id="dF" novalidate style="margin-top:12px"></form></div></div>
<div class="flash" id="flash"></div>
<script>
(function(){
  var K = KPTC, $ = function(i){ return document.getElementById(i); }, E = K.esc, tab = 'pages';
  function flash(t){ var x = $('flash'); x.textContent = t; x.classList.add('on'); clearTimeout(flash.t); flash.t = setTimeout(function(){ x.classList.remove('on'); }, 2400); }
  var PAGES = [['home','الصفحة الرئيسية','واجهة الزوار'],['routes','الخطوط والمسارات','البحث والخريطة'],['subs','الاشتراكات والتذاكر','الباقات والدفع'],['umrah','رحلات العمرة','الحجز والمقاعد'],['vip','باصات VIP والتأجير','الحجز والمعاينة'],['winch','الونش والورشة','الطلبات الطارئة'],['lost','المفقودات','البلاغات'],['ads','الإعلان على الحافلات','باقات المعلنين'],['reclient','مساحات للإيجار','العقارات للزوار'],['assistant','المساعد الذكي','كابتن كويت'],['media','المركز الإعلامي','الأخبار والصور'],['tenders','المناقصات','الفرص المطروحة'],['careers','الوظائف','الشواغر والتقديم'],['account','حسابي والمحفظة','تسجيل العملاء'],['tenant','بوابة المستأجر','المستأجرون الحاليون'],['portal','بوابة الموظفين','الدخول الوظيفي']];
  var TABS = {
    pages:['الصفحات والظهور','أظهر أو أخفِ أي صفحة من الموقع. الصفحة المخفية تختفي روابطها من القوائم ويرى من يفتحها رسالة «غير متاحة».'],
    news:['الأخبار والمركز الإعلامي','أضف خبراً أو بياناً صحفياً، عدّله، أو أوقف نشره.'],
    tenders:['المناقصات','اطرح مناقصة جديدة، غيّر حالتها، وراجع الشركات المهتمة.'],
    jobs:['الوظائف وطلبات التوظيف','أعلن عن وظيفة، وأدر طلبات المتقدمين وحالاتها.'],
    wallets:['المحافظ','أرصدة العملاء: تعبئة، خصم، استرجاع، وإيقاف مؤقت.'],
    bookings:['الحجوزات والطلبات','كل ما يحجزه العملاء من صفحات الخدمات، مع تغيير الحالة.'],
    log:['سجل النشاط','آخر ما حدث في الموقع.']
  };
  function nav(){
    var d = K.db(), c = {tenders:d.bids.filter(function(b){ return b.status === 'جديد'; }).length, jobs:d.applications.filter(function(a){ return a.status === 'قيد المراجعة'; }).length, bookings:d.bookings.filter(function(b){ return b.status === 'قيد المعالجة'; }).length};
    $('nav').innerHTML = '<h4>الموقع</h4>' + ['pages','news','tenders','jobs'].map(btn).join('') + '<h4>العملاء</h4>' + ['wallets','bookings'].map(btn).join('') + '<h4>النظام</h4>' + btn('log');
    function btn(k){ return '<button type="button" class="' + (k === tab ? 'on' : '') + '" data-tab="' + k + '">' + TABS[k][0] + (c[k] ? '<em class="num">' + c[k] + '</em>' : '') + '</button>'; }
  }
  function tag(s){ var c = /منشور|مفتوح|فعّال|مؤكد|مدفوع|مكتمل|مقبول|مقابلة|نشطة/.test(s) ? 'ok' : /مغلق|ملغ|مرفوض|موقوف|مخفي/.test(s) ? 'bad' : 'warn'; return '<span class="tag ' + c + '">' + E(s) + '</span>'; }
  function sel(list, cur, attrs){ return '<select class="s" ' + attrs + '>' + list.map(function(o){ return '<option' + (o === cur ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select>'; }
  var V = {
    pages: function(d){
      $('hA').innerHTML = '<a class="btn o" href="KPTC_Home.html">افتح الموقع</a>';
      var on = PAGES.filter(function(p){ return d.pages[p[0]] !== false; }).length;
      return '<div class="kp4"><div><b class="num">' + PAGES.length + '</b><span>صفحة في الموقع</span></div><div><b class="num">' + on + '</b><span>ظاهرة للزوار</span></div><div><b class="num">' + (PAGES.length - on) + '</b><span>مخفية</span></div><div><b>' + (d.notice.on ? 'مفعّل' : 'متوقف') + '</b><span>شريط التنبيه العام</span></div></div>' +
        '<div class="box" style="margin-bottom:18px"><h3>شريط تنبيه أعلى الموقع</h3><div style="display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center"><label class="f" style="margin:0"><input id="ntx" placeholder="مثال: تعديل مؤقت على مسار خط 15 حتى نهاية الأسبوع" value="' + E(d.notice.text) + '"></label><button class="btn sm" data-act="ntsave">حفظ النص</button><button class="sw ' + (d.notice.on ? 'on' : '') + '" data-act="nt" aria-label="تفعيل الشريط"></button></div></div>' +
        '<div class="tw">' + PAGES.map(function(p){ var vis = d.pages[p[0]] !== false; return '<div class="row"><div><b>' + p[1] + '</b><small>' + p[2] + '</small></div>' + tag(vis ? 'منشورة' : 'مخفية') + '<button class="sw ' + (vis ? 'on' : '') + '" data-act="pg" data-id="' + p[0] + '" aria-label="إظهار ' + p[1] + '"' + (p[0] === 'home' ? ' disabled title="الصفحة الرئيسية لا تُخفى"' : '') + '></button></div>'; }).join('') + '</div>';
    },
    news: function(d){
      $('hA').innerHTML = '<button class="btn y" data-act="new" data-k="news">خبر جديد</button>';
      return '<div class="tw"><table class="t"><thead><tr><th>العنوان</th><th>القسم</th><th>التاريخ</th><th>الحالة</th><th></th></tr></thead><tbody>' + d.news.map(function(n){ return '<tr><td style="min-width:260px"><b>' + E(n.title) + '</b></td><td>' + E(n.cat) + '</td><td class="num">' + K.date(n.d) + '</td><td>' + tag(n.pub ? 'منشور' : 'مخفي') + '</td><td style="white-space:nowrap"><button class="btn sm o" data-act="edit" data-k="news" data-id="' + n.id + '">تعديل</button><button class="btn sm o" data-act="pub" data-id="' + n.id + '">' + (n.pub ? 'إخفاء' : 'نشر') + '</button><button class="btn sm r" data-act="del" data-k="news" data-id="' + n.id + '">حذف</button></td></tr>'; }).join('') + '</tbody></table></div>';
    },
    tenders: function(d){
      $('hA').innerHTML = '<button class="btn y" data-act="new" data-k="tenders">طرح جديد</button>';
      return '<div class="tw" style="margin-bottom:22px"><table class="t"><thead><tr><th>الرقم</th><th>النوع</th><th>العنوان</th><th>آخر موعد</th><th>المهتمون</th><th>الحالة</th><th></th></tr></thead><tbody>' + d.tenders.map(function(t){ var n = d.bids.filter(function(b){ return b.tender === t.id; }).length; return '<tr><td class="num"><b>' + E(t.no) + '</b></td><td>' + E(t.kind) + '</td><td style="min-width:240px">' + E(t.title) + '</td><td class="num">' + K.date(t.close) + '</td><td class="num">' + n + '</td><td>' + sel(['مفتوحة','مغلقة','ملغاة','تمت الترسية'], t.status, 'data-act="tst" data-id="' + t.id + '"') + '</td><td style="white-space:nowrap"><button class="btn sm o" data-act="edit" data-k="tenders" data-id="' + t.id + '">تعديل</button><button class="btn sm r" data-act="del" data-k="tenders" data-id="' + t.id + '">حذف</button></td></tr>'; }).join('') + '</tbody></table></div><h2 class="st" style="font-size:19px">الشركات المهتمة</h2><div class="tw"><table class="t"><thead><tr><th>الشركة</th><th>المسؤول</th><th>الهاتف</th><th>السجل التجاري</th><th>المناقصة</th><th>التاريخ</th><th>الحالة</th></tr></thead><tbody>' + (d.bids.length ? d.bids.map(function(b){ var t = d.tenders.filter(function(x){ return x.id === b.tender; })[0] || {no:'—'}; return '<tr><td><b>' + E(b.co) + '</b></td><td>' + E(b.name) + '</td><td class="num">' + E(b.phone) + '</td><td class="num">' + E(b.cr || '—') + '</td><td class="num">' + E(t.no) + '</td><td class="num">' + K.date(b.d) + '</td><td>' + sel(['جديد','استلم الوثائق','قدّم عطاءً','مستبعد'], b.status, 'data-act="bst" data-id="' + b.id + '"') + '</td></tr>'; }).join('') : '<tr><td colspan="7" class="empty">لم تسجّل أي شركة اهتمامها بعد. جرّب من صفحة المناقصات.</td></tr>') + '</tbody></table></div>';
    },
    jobs: function(d){
      $('hA').innerHTML = '<button class="btn y" data-act="new" data-k="jobs">وظيفة جديدة</button>';
      return '<div class="tw" style="margin-bottom:22px"><table class="t"><thead><tr><th>الوظيفة</th><th>الإدارة</th><th>آخر موعد</th><th>المتقدمون</th><th>الحالة</th><th></th></tr></thead><tbody>' + d.jobs.map(function(j){ var n = d.applications.filter(function(a){ return a.job === j.id; }).length; return '<tr><td><b>' + E(j.title) + '</b></td><td>' + E(j.dept) + '</td><td class="num">' + K.date(j.close) + '</td><td class="num">' + n + '</td><td>' + tag(j.open ? 'مفتوحة' : 'مغلقة') + '</td><td style="white-space:nowrap"><button class="btn sm o" data-act="edit" data-k="jobs" data-id="' + j.id + '">تعديل</button><button class="btn sm o" data-act="jopen" data-id="' + j.id + '">' + (j.open ? 'إغلاق' : 'فتح') + '</button><button class="btn sm r" data-act="del" data-k="jobs" data-id="' + j.id + '">حذف</button></td></tr>'; }).join('') + '</tbody></table></div><h2 class="st" style="font-size:19px">طلبات التوظيف</h2><div class="tw"><table class="t"><thead><tr><th>المتقدم</th><th>الوظيفة</th><th>الهاتف</th><th>الخبرة</th><th>السيرة</th><th>التاريخ</th><th>الحالة</th></tr></thead><tbody>' + (d.applications.length ? d.applications.map(function(a){ var j = d.jobs.filter(function(x){ return x.id === a.job; })[0] || {title:'—'}; return '<tr><td><b>' + E(a.name) + '</b><br><small style="color:var(--kp-muted)">' + E(a.note || '') + '</small></td><td>' + E(j.title) + '</td><td class="num">' + E(a.phone) + '</td><td class="num">' + E(a.exp || '—') + '</td><td>' + E(a.cv || '—') + '</td><td class="num">' + K.date(a.d) + '</td><td>' + sel(['قيد المراجعة','مرشح للمقابلة','مقبول','اعتذار'], a.status, 'data-act="ast" data-id="' + a.id + '"') + '</td></tr>'; }).join('') : '<tr><td colspan="7" class="empty">لا توجد طلبات.</td></tr>') + '</tbody></table></div>';
    },
    wallets: function(d){
      $('hA').innerHTML = '';
      var ids = Object.keys(d.users), total = 0, tx = 0; ids.forEach(function(i){ var w = K.wallet(i); total += w.balance; tx += w.tx.length; });
      return '<div class="kp4"><div><b class="num">' + ids.length + '</b><span>محفظة</span></div><div><b class="num">' + K.money(total) + '</b><span>إجمالي الأرصدة</span></div><div><b class="num">' + tx + '</b><span>حركة مسجلة</span></div><div><b class="num">' + ids.filter(function(i){ return K.wallet(i).frozen; }).length + '</b><span>موقوفة</span></div></div><div class="tw"><table class="t"><thead><tr><th>العميل</th><th>الهاتف</th><th>الرصيد</th><th>آخر حركة</th><th>الحالة</th><th>إجراء من الإدارة</th></tr></thead><tbody>' + ids.map(function(i){ var u = d.users[i], w = K.wallet(i), l = w.tx[0]; return '<tr><td><b>' + E(u.name) + '</b></td><td class="num">' + E(u.phone) + '</td><td class="num"><b>' + K.money(w.balance) + '</b></td><td>' + (l ? E(l.t) + ' <span class="num">' + K.money(Math.abs(l.a)) + '</span> · <span class="num">' + K.date(l.d) + '</span>' : '—') + '</td><td>' + tag(w.frozen ? 'موقوفة' : 'نشطة') + '</td><td style="white-space:nowrap"><button class="btn sm" data-act="wadd" data-id="' + i + '">تعبئة</button><button class="btn sm o" data-act="wsub" data-id="' + i + '">خصم</button><button class="btn sm o" data-act="wref" data-id="' + i + '">استرجاع</button><button class="btn sm ' + (w.frozen ? 'y' : 'r') + '" data-act="wfrz" data-id="' + i + '">' + (w.frozen ? 'تفعيل' : 'إيقاف') + '</button></td></tr>'; }).join('') + '</tbody></table></div>';
    },
    bookings: function(d){
      $('hA').innerHTML = '';
      return '<div class="tw"><table class="t"><thead><tr><th>الرقم</th><th>النوع</th><th>التفاصيل</th><th>العميل</th><th>التاريخ</th><th>المبلغ</th><th>الحالة</th></tr></thead><tbody>' + (d.bookings.length ? d.bookings.map(function(b){ var u = d.users[b.uid]; return '<tr><td class="num"><b>' + E(b.id) + '</b></td><td><span class="tag in">' + E(b.type) + '</span></td><td>' + E(b.title) + '</td><td>' + E(u ? u.name : 'زائر غير مسجل') + '</td><td class="num">' + K.date(b.d) + '</td><td class="num">' + (b.amount ? K.money(b.amount) : '—') + '</td><td>' + sel(['قيد المعالجة','مؤكد','مدفوع','فعّال','مكتمل','ملغى'].indexOf(b.status) < 0 ? [b.status,'قيد المعالجة','مؤكد','مكتمل','ملغى'] : ['قيد المعالجة','مؤكد','مدفوع','فعّال','مكتمل','ملغى'], b.status, 'data-act="kst" data-id="' + b.id + '"') + '</td></tr>'; }).join('') : '<tr><td colspan="7" class="empty">لا توجد طلبات.</td></tr>') + '</tbody></table></div>';
    },
    log: function(d){

      return '<div class="tw">' + (d.log.length ? d.log.map(function(l){ return '<div class="row" style="grid-template-columns:1fr auto"><div>' + E(l.msg) + '</div><small class="num">' + E(l.d.replace('T',' ').slice(0,16)) + '</small></div>'; }).join('') : '<div class="empty">لا يوجد نشاط مسجل بعد.</div>') + '</div>';
    }
  };
  function render(){ nav(); $('hT').textContent = TABS[tab][0]; $('hD').textContent = TABS[tab][1]; $('view').innerHTML = V[tab](K.db()); }
  var FORMS = {
    news:{t:'خبر', f:[['title','العنوان'],['cat','القسم','select',['أخبار الشركة','بيانات صحفية','المسؤولية الاجتماعية']],['d','التاريخ','date'],['img','الصورة','select',['kbus-fleet.jpg','kbus-ev.jpg','kbus-street.jpg','kbus-depot.jpg','coach-1.jpg','tow-1.jpg','workshop-1.jpg','hq.jpg','umrah-art.jpg']],['body','النص','textarea']], d:function(){ return {id:K.id('N'), pub:true, d:K.today(), cat:'أخبار الشركة', img:'kbus-fleet.jpg'}; }},
    tenders:{t:'مناقصة', f:[['no','الرقم / السنة'],['kind','النوع','select',['مناقصة','ممارسة','مزايدة']],['title','العنوان'],['meet','الاجتماع التمهيدي','date'],['place','مكان الاجتماع'],['close','آخر موعد للعطاءات','date'],['box','رقم الصندوق'],['fee','قيمة الوثائق (د.ك)','number']], d:function(){ return {id:K.id('T'), status:'مفتوحة', kind:'مناقصة', meet:K.today(7), close:K.today(21), fee:75, box:'1'}; }},
    jobs:{t:'وظيفة', f:[['title','المسمى الوظيفي'],['dept','الإدارة'],['loc','مكان العمل'],['type','نوع الدوام','select',['دوام كامل','دوام جزئي','عقد مؤقت']],['close','آخر موعد للتقديم','date'],['req','المتطلبات','textarea']], d:function(){ return {id:K.id('J'), open:true, type:'دوام كامل', close:K.today(30)}; }}
  };
  var editing = null;
  function openForm(k, id){
    var F = FORMS[k], item = id ? K.db()[k].filter(function(x){ return x.id === id; })[0] : F.d(); editing = {k:k, item:item, isNew:!id};
    $('dT').textContent = (id ? 'تعديل ' : 'إضافة ') + F.t;
    $('dF').innerHTML = F.f.map(function(f){ var v = item[f[0]] == null ? '' : item[f[0]], c;
      if (f[2] === 'select') c = '<select name="' + f[0] + '">' + f[3].map(function(o){ return '<option' + (o === v ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select>';
      else if (f[2] === 'textarea') c = '<textarea name="' + f[0] + '" rows="3">' + E(v) + '</textarea>';
      else c = '<input name="' + f[0] + '" ' + (f[2] === 'date' ? 'type="date"' : f[2] === 'number' ? 'inputmode="decimal" dir="ltr"' : '') + ' value="' + E(v) + '">';
      return '<label class="f">' + f[1] + c + '</label>'; }).join('') + '<div class="err" id="dE"></div><button class="btn y" type="submit">حفظ</button>';
    $('dlg').classList.add('on');
  }
  $('dF').addEventListener('submit', function(e){ e.preventDefault(); if (!editing) return; var F = FORMS[editing.k], ok = true;
    F.f.forEach(function(f){ var el = $('dF').elements[f[0]], v = el.value.trim(); if (f[2] === 'number') v = parseFloat(K.latin(v)) || 0; if (!v && f[2] !== 'number' && f[0] !== 'place' && f[0] !== 'box') ok = false; editing.item[f[0]] = v; });
    if (!ok){ $('dE').textContent = 'أكمل كل الحقول.'; return; }
    if (editing.isNew) K.db()[editing.k].unshift(editing.item); K.log((editing.isNew ? 'إضافة ' : 'تعديل ') + F.t + ': ' + (editing.item.title || '')); K.save(); $('dlg').classList.remove('on'); flash('تم الحفظ. التغيير ظاهر في الموقع الآن.'); });
  function amount(label, cb){ editing = null; $('dT').textContent = label; $('dF').innerHTML = '<label class="f">المبلغ (د.ك)<input name="a" inputmode="decimal" dir="ltr" autofocus></label><label class="f">السبب / البيان<input name="n"></label><div class="err" id="dE"></div><button class="btn y" type="submit">تنفيذ</button>'; $('dlg').classList.add('on');
    $('dF').onsubmit = function(e){ e.preventDefault(); e.stopImmediatePropagation(); var a = parseFloat(K.latin($('dF').elements.a.value)); if (!(a > 0)){ $('dE').textContent = 'أدخل مبلغاً أكبر من صفر.'; return; } var r = cb(a, $('dF').elements.n.value.trim()); if (r && r.error){ $('dE').textContent = r.error; return; } $('dF').onsubmit = null; $('dlg').classList.remove('on'); flash('تم تنفيذ العملية.'); }; }
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-tab]'); if (t){ tab = t.getAttribute('data-tab'); render(); return; }
    if (e.target.closest('[data-close]')){ $('dlg').classList.remove('on'); $('dF').onsubmit = null; return; }
    var b = e.target.closest('button[data-act]'); if (!b) return; var a = b.getAttribute('data-act'), id = b.getAttribute('data-id'), k = b.getAttribute('data-k'), d = K.db();
    function find(list){ return list.filter(function(x){ return x.id === id; })[0]; }
    if (a === 'pg'){ var vis = d.pages[id] !== false; d.pages[id] = vis ? false : true; K.log((vis ? 'إخفاء' : 'إظهار') + ' صفحة: ' + PAGES.filter(function(p){ return p[0] === id; })[0][1]); K.save(); flash(vis ? 'أُخفيت الصفحة عن الزوار.' : 'الصفحة ظاهرة الآن.'); }
    else if (a === 'nt'){ d.notice.on = !d.notice.on; d.notice.text = $('ntx').value.trim(); K.save(); }
    else if (a === 'ntsave'){ d.notice.text = $('ntx').value.trim(); K.save(); flash('حُفظ نص التنبيه.'); }
    else if (a === 'new') openForm(k);
    else if (a === 'edit') openForm(k, id);
    else if (a === 'del'){ if (b.getAttribute('data-sure')){ d[k] = d[k].filter(function(x){ return x.id !== id; }); K.log('حذف من ' + k); K.save(); flash('تم الحذف.'); } else { b.setAttribute('data-sure','1'); b.textContent = 'تأكيد الحذف'; } }
    else if (a === 'pub'){ var n = find(d.news); n.pub = !n.pub; K.save(); }
    else if (a === 'jopen'){ var j = find(d.jobs); j.open = !j.open; K.save(); }
    else if (a === 'wfrz'){ var w = K.wallet(id); w.frozen = !w.frozen; K.log((w.frozen ? 'إيقاف' : 'تفعيل') + ' محفظة ' + d.users[id].name); K.save(); flash(w.frozen ? 'أُوقفت المحفظة.' : 'فُعّلت المحفظة.'); }
    else if (a === 'wadd') amount('تعبئة محفظة ' + d.users[id].name, function(v, n){ return K.walletTx(id, v, 'تعبئة', n || 'تعبئة من الإدارة', 'الإدارة'); });
    else if (a === 'wsub') amount('خصم من محفظة ' + d.users[id].name, function(v, n){ return K.walletTx(id, -v, 'خصم', n || 'خصم من الإدارة', 'الإدارة'); });
    else if (a === 'wref') amount('استرجاع إلى محفظة ' + d.users[id].name, function(v, n){ return K.walletTx(id, v, 'استرجاع', n || 'استرجاع مبلغ', 'الإدارة'); });
    else if (a === 'reset'){ if (b.getAttribute('data-sure')){ K.reset(); flash('أُعيدت البيانات التجريبية.'); } else { b.setAttribute('data-sure','1'); b.textContent = 'تأكيد: امسح كل التعديلات'; } }
  });
  document.addEventListener('change', function(e){ var s = e.target.closest('select[data-act]'); if (!s) return; var a = s.getAttribute('data-act'), id = s.getAttribute('data-id'), d = K.db(), L = {tst:d.tenders, bst:d.bids, ast:d.applications, kst:d.bookings}[a], it = L.filter(function(x){ return x.id === id; })[0]; it.status = s.value; K.log('تغيير حالة ' + id + ' إلى ' + s.value); K.save(); flash('حُدّثت الحالة.'); });
  K.onChange(render); render();
})();
</script>

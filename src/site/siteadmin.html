<!--title:مركز التحكم — KPTC-->
<!--chrome:admin-->
<style>
body{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#14133A 0%,#1b1950 100%);color:#fff;position:sticky;top:0;height:100vh;overflow:auto;padding-bottom:20px;scrollbar-width:thin;scrollbar-color:#3b3a78 transparent}
.ab{display:flex;gap:10px;align-items:center;padding:18px 18px 14px}
.ab .kp-mark{width:38px;height:38px}.ab b{letter-spacing:.14em;direction:ltr}.ab small{display:block;color:#A9A7C9;font-size:11.5px}
.nv-q{position:relative;margin:4px 14px 6px}.nv-q svg{position:absolute;inset-inline-start:11px;top:50%;translate:0 -50%;width:16px;height:16px;color:#8E8CB8;pointer-events:none}
.nv-q input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:9px 12px 9px 12px;padding-inline-start:34px;color:#fff;font:500 13.5px var(--f-body);outline:0;transition:.2s}
.nv-q input::placeholder{color:#8E8CB8}.nv-q input:focus{border-color:var(--kp-sign);background:rgba(255,255,255,.11)}
aside nav{padding:0 10px}
.nv-g{margin-top:6px}
.nv-h{display:flex!important;align-items:center;gap:8px;width:100%;background:none!important;border:0!important;color:#8E8CB8!important;padding:10px 10px 6px!important;font:700 11.5px var(--f-body)!important;letter-spacing:.04em;cursor:pointer;text-align:start}
.nv-h::after{content:"";margin-inline-start:auto;width:7px;height:7px;border-inline-end:2px solid currentColor;border-bottom:2px solid currentColor;rotate:45deg;transition:rotate .2s;translate:0 -2px}
.nv-g.shut .nv-h::after{rotate:-45deg}.nv-g.shut .nv-l{display:none}
.nv-h i{font-style:normal;background:rgba(255,255,255,.1);border-radius:9px;padding:0 7px;font-size:10.5px;color:#C9C8E6}
.nv-l{display:grid;gap:2px}
.nv-l button{position:relative;display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;border-radius:10px;color:#C9C8E6;padding:9px 11px;font:500 14px var(--f-body);cursor:pointer;text-align:start;transition:background .18s,color .18s}
.nv-l button .ni{flex:none;width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.07);display:grid;place-items:center;color:#B9B7DD;transition:.18s}
.nv-l button .ni svg{width:17px;height:17px}
.nv-l button span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nv-l button:hover{background:rgba(255,255,255,.06);color:#fff}.nv-l button:hover .ni{background:rgba(255,255,255,.12)}
.nv-l button.on{background:linear-gradient(90deg,rgba(255,201,60,.18),rgba(255,201,60,.05));color:#fff;font-weight:700}
.nv-l button.on .ni{background:var(--kp-sign);color:var(--kp-ink)}
.nv-l button.on::before{content:"";position:absolute;inset-inline-end:-10px;top:8px;bottom:8px;width:4px;border-radius:3px;background:var(--kp-sign)}
.nv-l button em{font-style:normal;font-size:11px;font-weight:700;background:var(--kp-sign);color:var(--kp-ink);border-radius:9px;padding:0 7px;min-width:20px;text-align:center}
.nv-l button.hid{display:none}.nv-g.hid{display:none}
.nv-none{display:none;margin:14px;padding:12px;border:1px dashed rgba(255,255,255,.2);border-radius:10px;color:#A9A7C9;font-size:13px;text-align:center}.nv-none.on{display:block}
.who{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;margin:2px 14px 10px;padding:11px 12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:14px}
.who i{overflow:hidden;width:40px;height:40px;border-radius:50%;background:var(--kp-sign);color:var(--kp-ink);display:grid;place-items:center;font:700 16px var(--f-display);font-style:normal;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.who i .kp-av-f{width:100%;height:100%;object-fit:cover}
.who b{display:block;font-size:13.5px;color:#fff;line-height:1.3}.who small{color:#A9A7C9;font-size:11px;display:block;line-height:1.4}
.who button{width:auto!important;border:1px solid rgba(255,255,255,.22)!important;border-radius:8px;padding:5px 9px!important;color:#fff!important;background:none;cursor:pointer}
.backs{display:grid;gap:6px;margin:16px 14px 0;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
.backs a{display:flex;align-items:center;gap:8px;color:#C9C8E6;text-decoration:none;font-size:13px;padding:8px 11px;border:1px solid rgba(255,255,255,.12);border-radius:10px;transition:.18s}
.backs a:hover{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.3)}
/* sections panel */
.scp{margin-bottom:14px}
.scb{padding:0;overflow:hidden}
.sc-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--kp-line);background:var(--kp-paper-2)}.sc-h h3{margin:0}.sc-h small{color:var(--kp-muted);font-size:13px}
.sc-bt{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.sc-bt .btn{padding:7px 12px;font-size:13px}
.sc-l{list-style:none;margin:0;padding:0}
.sc-l li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--kp-line);background:#fff;transition:background .15s}
.sc-l li:hover{background:#FFFBEB}.sc-l li.off{background:var(--kp-paper-2)}.sc-l li.off b{color:var(--kp-muted);text-decoration:line-through}
.sc-n{width:28px;height:28px;border-radius:50%;background:var(--kp-paper);border:1px solid var(--kp-line);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--kp-indigo)}
.sc-l b{display:block;font-size:14.5px;line-height:1.45;overflow-wrap:anywhere}.sc-l small{color:var(--kp-muted);font-size:12px}
.sc-t{margin:0;padding:12px 18px;color:var(--kp-muted);font-size:12.5px;background:var(--kp-paper-2)}
.sc-load{display:grid;gap:10px;padding:18px}.sc-load i{display:block;height:44px;border-radius:8px;background:linear-gradient(90deg,#eee,#f7f6f1,#eee);background-size:200% 100%;animation:scl 1.2s linear infinite}@keyframes scl{to{background-position:-200% 0}}
.mn{padding:26px 30px 60px;min-width:0}
.mh{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.mh h1{font-size:26px}.mh p{color:var(--kp-muted)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--kp-line);background:#fff}
.row:last-child{border:0}.row b{display:block}.row small{color:var(--kp-muted)}
.sw{position:relative;width:50px;height:28px;border-radius:20px;background:var(--kp-line-2);border:0;cursor:pointer;transition:background .25s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .25s var(--kp-ease);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--kp-ok)}.sw.on::after{right:25px}
.kp4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kp4 div{background:#fff;border:1px solid var(--kp-line);border-top:3px solid var(--kp-indigo);border-radius:4px;padding:14px 16px}
.kp4 b{display:block;font:700 26px/1.2 var(--f-display);color:var(--kp-indigo)}.kp4 span{font-size:12.5px;color:var(--kp-muted)}
td .btn{margin-inline-end:4px}
select.s{border:1.5px solid var(--kp-line-2);border-radius:4px;padding:5px 8px;font:600 13px var(--f-body);background:#fff}
@media(max-width:900px){body{grid-template-columns:1fr}aside{position:static;height:auto}.nv-g.shut .nv-l{display:grid}.nv-l{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.nv-l button.on::before{display:none}.kp4{grid-template-columns:1fr 1fr}.mn{padding:18px 14px 50px}}
/* studio */
.studio{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,44%);gap:20px;align-items:start}
.st3.edm button.on{background:var(--kp-ink);color:var(--kp-sign)}
.pv-slot{position:sticky;top:16px;height:calc(min(70vh,640px) + 42px)}
.fh{position:fixed;z-index:30;overflow:hidden}.fh[hidden]{display:none}#pvHost .pv{position:static;height:100%}#edHost{border:2px solid var(--kp-ink);border-radius:8px;background:var(--kp-paper);box-sizing:border-box;direction:ltr}
.pv{position:sticky;top:16px;background:#fff;border:1px solid var(--kp-line);border-radius:6px;overflow:hidden}
.pv-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--kp-line);font-size:13px;font-weight:700}
.pv-h .seg{display:flex;border:1.5px solid var(--kp-line-2);border-radius:3px;overflow:hidden}
.pv-h .seg button{border:0;background:#fff;padding:4px 10px;font:600 12px var(--f-body);cursor:pointer;color:var(--kp-muted)}
.pv-h .seg button.on{background:var(--kp-ink);color:var(--kp-sign)}
.pv-b{background:var(--kp-paper);position:relative;height:min(70vh,640px);overflow:hidden;direction:ltr}
.pv-b iframe{position:absolute;top:0;left:0;border:0;background:#fff;width:1280px;transform-origin:0 0}
.pv-b.mob iframe{width:390px;box-shadow:0 0 0 1px var(--kp-line-2)}
.pv-n{position:absolute;inset-inline:0;bottom:0;z-index:3;pointer-events:none;display:none;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px;border-top:1px solid var(--kp-line);background:rgba(250,249,245,.96);direction:rtl;font-size:12.5px}.pv-n.on{display:flex}.pv-n b{font-size:12px;color:var(--kp-muted)}.pv-n span{color:var(--kp-ink);display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--kp-line-2);border-radius:14px;padding:2px 10px 2px 4px;font-weight:600}.pv-n i{font-style:normal;background:var(--kp-indigo);color:var(--kp-sign);border-radius:10px;padding:0 8px;font-size:11px}.pv-n .k-hide i{background:#C2352E;color:#fff}.pv-n .k-show i{background:#16A36A;color:#fff}
.pg{background:#fff;border:1px solid var(--kp-line);border-radius:6px;margin-bottom:8px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.pg.sel{border-color:var(--kp-indigo);box-shadow:inset -5px 0 0 var(--kp-sign)}
.pg-h{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:11px 14px;cursor:pointer}
.pg-h b{display:block;font-size:15px}.pg-h small{color:var(--kp-muted);font-size:12.5px}
.mv{display:grid;gap:2px}.mv button{width:24px;height:18px;border:1px solid var(--kp-line-2);background:#fff;border-radius:2px;cursor:pointer;font-size:10px;line-height:1;color:var(--kp-indigo)}
.mv button[disabled]{opacity:.25}
.st3{display:flex;border:1.5px solid var(--kp-line-2);border-radius:3px;overflow:hidden}
.st3 button{border:0;background:#fff;padding:5px 10px;font:600 12.5px var(--f-body);cursor:pointer;color:var(--kp-muted)}
.st3 button+button{border-inline-start:1.5px solid var(--kp-line-2)}
.st3 button.on[data-v=on]{background:var(--kp-ok);color:#fff}.st3 button.on[data-v=maint]{background:var(--kp-warn);color:#fff}.st3 button.on[data-v=off]{background:var(--kp-bad);color:#fff}
.pg-x{display:none;grid-template-columns:1fr 1fr;gap:12px;padding:4px 14px 16px;border-top:1px dashed var(--kp-line-2);background:var(--kp-paper-2)}
.pg.open .pg-x{display:grid}
.pg-x .full{grid-column:1/-1}
.more{border:0;background:none;color:var(--kp-indigo);font:600 12.5px var(--f-body);cursor:pointer;padding:4px}
.sec-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--kp-line);background:#fff}
.sec-row:last-child{border:0}
.gbox{display:grid;gap:12px;margin-bottom:16px}
.gbox h3{display:flex;justify-content:space-between;align-items:center}
textarea.code{font:500 12px/1.5 ui-monospace,Menlo,monospace;direction:ltr;min-height:120px}
@media(max-width:1100px){.studio{grid-template-columns:1fr}.pv{position:static}}

/* control centre: overview, accounts, reports */
.ov-hero{display:flex;justify-content:space-between;align-items:center;gap:14px;background:linear-gradient(120deg,var(--kp-indigo),#3d3a96);color:#fff;border-radius:18px;padding:22px 26px;margin-bottom:16px;position:relative;overflow:hidden}
.ov-hero::after{content:"";position:absolute;inset-inline-start:-50px;bottom:-90px;width:210px;height:210px;border-radius:50%;border:34px solid rgba(255,201,60,.15)}
.ov-hero small{color:#CFCDEA;font-size:13px}.ov-hero h2{font-size:clamp(20px,2.6vw,28px);color:#fff;margin:2px 0}.ov-hero p{color:#D7D5F0;font-size:14px}
.ov-pill{position:relative;z-index:1;background:var(--kp-sign);color:var(--kp-ink);border-radius:20px;padding:5px 16px;font-weight:700;font-size:13px;white-space:nowrap}
.ov-kpi{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.ov-kpi>div{background:#fff;border:1px solid var(--kp-line);border-radius:16px;padding:14px;display:grid;gap:2px;justify-items:start}
.ov-kpi i{width:34px;height:34px;border-radius:10px;background:var(--kp-ink);color:var(--kp-sign);display:grid;place-items:center;margin-bottom:6px}.ov-kpi i svg{width:18px;height:18px}
.ov-kpi b{font:800 24px/1.15 var(--f-display);color:var(--kp-indigo);direction:rtl;text-align:start;overflow-wrap:anywhere}.ov-kpi span{font-size:12.5px;color:var(--kp-muted)}
.ov-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;align-items:start}.ov-c{display:grid;gap:16px}
.ov-b{padding:18px}.ov-b h3{margin-bottom:10px}
.ov-n{display:flex;align-items:center;gap:10px;width:100%;background:var(--kp-paper-2);border:1px solid var(--kp-line);border-radius:12px;padding:10px 14px;margin-bottom:8px;cursor:pointer;font:600 14px var(--f-body);color:var(--kp-ink);text-align:start;transition:.15s}
.ov-n span{flex:1}.ov-n b{background:var(--kp-sign);border-radius:12px;padding:0 10px;min-width:28px;text-align:center}.ov-n svg{width:16px;height:16px;color:var(--kp-muted);flex:none}.ov-n:hover{border-color:var(--kp-indigo);background:#fff}.ov-n.w{border-color:#E5B14A;background:#FFF8E6}
.ov-ok{color:var(--kp-muted);font-size:14px;padding:6px 0}.ov-tip{font-size:12.5px;color:var(--kp-muted);margin-top:4px}
.ov-bar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;margin-bottom:9px;font-size:13.5px}.ov-bar i{height:10px;border-radius:6px;background:var(--kp-paper);overflow:hidden}.ov-bar u{display:block;height:100%;background:linear-gradient(90deg,var(--kp-indigo),#6a67c9);border-radius:6px}.ov-bar b{min-width:24px;text-align:end}
.ov-l{padding:8px 0;border-bottom:1px solid var(--kp-line);font-size:13.5px}.ov-l:last-child{border:0}.ov-l small{display:block;color:var(--kp-muted);font-size:12px}
.ov-qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ov-qa button{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--kp-line);border-radius:14px;padding:12px 14px;cursor:pointer;font:700 13.5px var(--f-body);color:var(--kp-ink);transition:.15s}.ov-qa button:hover{border-color:var(--kp-indigo);translate:0 -2px}.ov-qa i{width:32px;height:32px;border-radius:9px;background:var(--kp-paper);color:var(--kp-indigo);display:grid;place-items:center;flex:none}.ov-qa i svg{width:17px;height:17px}
.ac-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ac-q{position:relative;flex:1;min-width:260px}.ac-q svg{position:absolute;inset-inline-start:14px;top:50%;translate:0 -50%;width:19px;height:19px;color:var(--kp-muted);pointer-events:none}
.ac-q input{width:100%;border:2px solid var(--kp-line);background:#fff;border-radius:14px;padding:13px 16px;padding-inline-start:44px;font:500 15px var(--f-body);outline:0}.ac-q input:focus{border-color:var(--kp-indigo);box-shadow:0 0 0 4px rgba(46,44,120,.1)}
.ac-seg{display:flex;border:2px solid var(--kp-line);border-radius:12px;overflow:hidden;background:#fff}.ac-seg button{border:0;background:none;padding:10px 14px;font:700 13px var(--f-body);color:var(--kp-muted);cursor:pointer;white-space:nowrap}.ac-seg button.on{background:var(--kp-ink);color:var(--kp-sign)}
.ac-meta{font-size:12.5px;color:var(--kp-muted);margin-bottom:8px}
.ac-res{display:grid;gap:8px}
.ac-r{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:14px;align-items:center;width:100%;background:#fff;border:1px solid var(--kp-line);border-radius:14px;padding:11px 14px;cursor:pointer;text-align:start;font:inherit;color:inherit;transition:.15s}
.ac-r:hover,.ac-r.on{border-color:var(--kp-indigo);box-shadow:0 8px 20px -14px rgba(31,29,92,.6)}.ac-r.on{background:#FFFBEB}
.ac-av{width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--kp-sign);display:grid;place-items:center;font:700 17px var(--f-display);color:var(--kp-ink);flex:none}.ac-av .kp-av{width:100%;height:100%;object-fit:cover;display:grid;place-items:center}
.ac-m{min-width:0}.ac-m b{display:block;font-size:15px;line-height:1.4;overflow-wrap:anywhere}.ac-m small{display:block;color:var(--kp-muted);font-size:12.5px;overflow-wrap:anywhere}
.ac-own{font-style:normal;font-size:10.5px;background:var(--kp-ink);color:var(--kp-sign);border-radius:10px;padding:0 8px;margin-inline-start:6px;font-weight:700}
.ac-k i,.ac-dh p i{font-style:normal;font-size:12px;font-weight:700;border-radius:12px;padding:2px 11px;border:1px solid var(--kp-line-2);background:var(--kp-paper-2)}.ac-k i.u,.ac-dh p i.u{background:#EAF4FF;border-color:#BCD7F3;color:#1E5A96}.ac-k i.s,.ac-dh p i.s{background:#EFEEFB;border-color:#C9C7EE;color:var(--kp-indigo)}
.ac-x{font-size:12.5px;color:var(--kp-muted);white-space:nowrap}
.ac-st{font-size:12px;font-weight:700;border-radius:12px;padding:2px 11px}.ac-st.on{background:#EAF8F1;color:#0C7A4D}.ac-st.off{background:#FCEDEC;color:#A82A24}
.ac-none{text-align:center;padding:40px;border:2px dashed var(--kp-line);border-radius:14px;color:var(--kp-muted)}.ac-none b{display:block;color:var(--kp-ink);font-size:16px}
.ac-d{position:fixed;top:0;bottom:0;left:0;width:min(420px,100%);color:var(--kp-ink);background:#fff;z-index:700;box-shadow:12px 0 40px -10px rgba(20,19,58,.45);padding:20px;overflow:auto;translate:-105% 0;transition:translate .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}.ac-d.on{translate:0 0;visibility:visible}
.ac-dh{display:flex;gap:14px;align-items:center;margin-bottom:14px;position:relative;padding-top:8px}.ac-dx{position:absolute;top:-6px;inset-inline-end:-4px;width:34px;height:34px;border-radius:50%;border:0;background:var(--kp-paper);font-size:20px;cursor:pointer}
.ac-dav{width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--kp-sign);display:grid;place-items:center;font:700 26px var(--f-display);flex:none}.ac-dav .kp-av{width:100%;height:100%;object-fit:cover;display:grid;place-items:center}
.ac-dh h3{font-size:20px;margin-bottom:4px}.ac-dh p{display:flex;gap:6px;flex-wrap:wrap}
.ac-kv{display:grid;border:1px solid var(--kp-line);border-radius:12px;overflow:hidden;margin-bottom:12px}.ac-kv div{display:flex;justify-content:space-between;gap:12px;padding:9px 13px;font-size:13.5px}.ac-kv div+div{border-top:1px solid var(--kp-line)}.ac-kv span{color:var(--kp-muted)}.ac-kv b{text-align:start;overflow-wrap:anywhere}.ac-kv b.num{text-align:right}
.ac-a{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.ac-a .btn{justify-content:center;text-align:center;padding:9px 8px;font-size:13px}.ac-a .btn.r{background:#fff;color:var(--kp-bad);border-color:var(--kp-bad)}

  document.addEventListener('change', function(e){ var s = e.target.closest('[data-fs]'); if (!s) return; var it = K.db().found.filter(function(x){ return x.id === s.getAttribute('data-fs'); })[0]; it.status = s.value; K.log('حالة غرض ' + it.id + ': ' + s.value); K.save(); flash('حُفظت الحالة.'); });

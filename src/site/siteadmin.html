<!--title:مركز إدارة الموقع — KPTC-->
<!--chrome:admin-->
<style>
body{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--kp-ink);color:#fff;position:sticky;top:0;height:100vh;overflow:auto;padding-bottom:20px}
.ab{display:flex;gap:10px;align-items:center;padding:16px;border-bottom:1px solid rgba(255,255,255,.1)}
.ab .kp-mark{width:38px;height:38px}.ab b{letter-spacing:.14em;direction:ltr}.ab small{display:block;color:#A9A7C9;font-size:11.5px}
aside h4{font:600 11.5px var(--f-body);color:#8E8CB8;padding:16px 16px 6px}
aside button{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-right:4px solid transparent;color:#C9C8E6;padding:10px 16px;font:500 14px var(--f-body);cursor:pointer;text-align:right}
aside button:hover{background:rgba(255,255,255,.05);color:#fff}
aside button.on{background:rgba(255,201,60,.1);color:#fff;border-right-color:var(--kp-sign);font-weight:700}
aside button em{font-style:normal;font-size:11px;font-weight:700;background:var(--kp-sign);color:var(--kp-ink);border-radius:2px;padding:0 6px}
.mn{padding:26px 30px 60px;min-width:0}
.mh{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.mh h1{font-size:26px}.mh p{color:var(--kp-muted)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--kp-line);background:#fff}
.row:last-child{border:0}.row b{display:block}.row small{color:var(--kp-muted)}
.sw{position:relative;width:50px;height:28px;border-radius:20px;background:var(--kp-line-2);border:0;cursor:pointer;transition:background .25s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .25s var(--kp-ease);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--kp-ok)}.sw.on::after{right:25px}
.kp4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kp4 div{background:#fff;border:1px solid var(--kp-line);border-top:3px solid var(--kp-indigo);border-radius:4px;padding:14px 16px}
.kp4 b{display:block;font:700 26px/1.2 var(--f-display);color:var(--kp-indigo)}.kp4 span{font-size:12.5px;color:var(--kp-muted)}
td .btn{margin-inline-end:4px}
select.s{border:1.5px solid var(--kp-line-2);border-radius:4px;padding:5px 8px;font:600 13px var(--f-body);background:#fff}
@media(max-width:900px){body{grid-template-columns:1fr}aside{position:static;height:auto}aside nav{display:flex;overflow-x:auto}aside h4{display:none}aside button{white-space:nowrap;border-right:0;border-bottom:4px solid transparent}aside button.on{border-bottom-color:var(--kp-sign)}.kp4{grid-template-columns:1fr 1fr}.mn{padding:18px 14px 50px}}
/* studio */
.studio{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,44%);gap:20px;align-items:start}
.pv{position:sticky;top:16px;background:#fff;border:1px solid var(--kp-line);border-radius:6px;overflow:hidden}
.pv-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--kp-line);font-size:13px;font-weight:700}
.pv-h .seg{display:flex;border:1.5px solid var(--kp-line-2);border-radius:3px;overflow:hidden}
.pv-h .seg button{border:0;background:#fff;padding:4px 10px;font:600 12px var(--f-body);cursor:pointer;color:var(--kp-muted)}
.pv-h .seg button.on{background:var(--kp-ink);color:var(--kp-sign)}
.pv-b{background:var(--kp-paper);position:relative;height:min(70vh,640px);overflow:hidden;direction:ltr}
.pv-b iframe{position:absolute;top:0;left:0;border:0;background:#fff;width:1280px;transform-origin:0 0}
.pv-b.mob iframe{width:390px;box-shadow:0 0 0 1px var(--kp-line-2)}
.pg{background:#fff;border:1px solid var(--kp-line);border-radius:6px;margin-bottom:8px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.pg.sel{border-color:var(--kp-indigo);box-shadow:inset -5px 0 0 var(--kp-sign)}
.pg-h{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:11px 14px;cursor:pointer}
.pg-h b{display:block;font-size:15px}.pg-h small{color:var(--kp-muted);font-size:12.5px}
.mv{display:grid;gap:2px}.mv button{width:24px;height:18px;border:1px solid var(--kp-line-2);background:#fff;border-radius:2px;cursor:pointer;font-size:10px;line-height:1;color:var(--kp-indigo)}
.mv button[disabled]{opacity:.25}
.st3{display:flex;border:1.5px solid var(--kp-line-2);border-radius:3px;overflow:hidden}
.st3 button{border:0;background:#fff;padding:5px 10px;font:600 12.5px var(--f-body);cursor:pointer;color:var(--kp-muted)}
.st3 button+button{border-inline-start:1.5px solid var(--kp-line-2)}
.st3 button.on[data-v=on]{background:var(--kp-ok);color:#fff}.st3 button.on[data-v=maint]{background:var(--kp-warn);color:#fff}.st3 button.on[data-v=off]{background:var(--kp-bad);color:#fff}
.pg-x{display:none;grid-template-columns:1fr 1fr;gap:12px;padding:4px 14px 16px;border-top:1px dashed var(--kp-line-2);background:var(--kp-paper-2)}
.pg.open .pg-x{display:grid}
.pg-x .full{grid-column:1/-1}
.more{border:0;background:none;color:var(--kp-indigo);font:600 12.5px var(--f-body);cursor:pointer;padding:4px}
.sec-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--kp-line);background:#fff}
.sec-row:last-child{border:0}
.gbox{display:grid;gap:12px;margin-bottom:16px}
.gbox h3{display:flex;justify-content:space-between;align-items:center}
textarea.code{font:500 12px/1.5 ui-monospace,Menlo,monospace;direction:ltr;min-height:120px}
@media(max-width:1100px){.studio{grid-template-columns:1fr}.pv{position:static}}
</style>

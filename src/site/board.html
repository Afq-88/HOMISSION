<!--title:مجلس الإدارة — KPTC-->
<!--hero:kp-hero-->
<style>
.bt{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:4px 0 26px}
.bt .seg2{display:inline-flex;background:#fff;border:1.5px solid var(--kp-line-2);border-radius:14px;padding:4px}
.bt .seg2 button{border:0;background:none;font:700 14.5px var(--f-body);padding:9px 20px;border-radius:10px;cursor:pointer;color:var(--kp-muted);display:inline-flex;gap:8px;align-items:center}
.bt .seg2 button em{font-style:normal;font-size:12px;background:var(--kp-paper);border-radius:9px;padding:0 8px;color:var(--kp-indigo)}
.bt .seg2 button.on{background:var(--kp-indigo);color:#fff}.bt .seg2 button.on em{background:rgba(255,255,255,.18);color:#fff}
.bt .q{position:relative;flex:1;min-width:220px;max-width:380px;margin-inline-start:auto}
.bt .q svg{position:absolute;inset-inline-start:14px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--kp-muted);pointer-events:none}
.bt .q input{width:100%;border:2px solid var(--kp-line);border-radius:14px;padding:10px 14px;padding-inline-start:42px;font:500 15px var(--f-body);outline:0;background:#fff}.bt .q input:focus{border-color:var(--kp-indigo);box-shadow:0 0 0 4px rgba(46,44,120,.1)}
.sp{display:grid;grid-template-columns:minmax(0,330px) 1fr;gap:0;background:#fff;border:1px solid var(--kp-line);border-radius:30px;overflow:hidden;margin-bottom:26px;box-shadow:0 30px 50px -40px rgba(31,29,92,.6)}
.sp .im{position:relative;min-height:340px;background:var(--kp-indigo)}
.sp .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 12%}
.sp .tx{padding:36px 40px;display:grid;align-content:center;gap:12px;background:linear-gradient(120deg,#fff 55%,#F7F6FD)}
.sp .rl{justify-self:start;font:800 13px var(--f-body);color:var(--kp-ink);background:var(--kp-sign);border-radius:10px;padding:3px 14px}
.sp h2{font:800 clamp(28px,3.4vw,42px)/1.35 var(--f-display);color:var(--kp-indigo)}
.sp p{color:var(--kp-muted);font-size:15px;line-height:1.8;max-width:34em}
.sp .ac{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:20px}
.pc{background:#fff;border:1px solid var(--kp-line);border-radius:24px;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;transition:translate .25s,box-shadow .25s;opacity:0;translate:0 16px}
.pc.in{opacity:1;translate:0 0;transition:opacity .5s,translate .5s,box-shadow .25s}
.pc:hover{box-shadow:0 26px 40px -28px rgba(31,29,92,.55);translate:0 -4px}
.pc .im{position:relative;aspect-ratio:1/1.05;background:var(--kp-paper);overflow:hidden;border:0;padding:0;cursor:pointer;display:block;width:100%}
.pc .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 12%;transition:transform .5s}.pc:hover .im img{transform:scale(1.04)}
.nopic{position:absolute;inset:0;display:grid;place-items:center;font:800 64px var(--f-display);color:var(--kp-sign);background:var(--kp-indigo)}
.pc .bd{padding:16px 18px 6px;display:grid;gap:4px;align-content:start}
.pc h3{font:800 17px/1.5 var(--f-display);color:var(--kp-indigo)}.pc .t{font-size:13.5px;color:var(--kp-ink);line-height:1.6}.pc .u{font-size:12.5px;color:var(--kp-muted)}
.pc .ft{padding:10px 18px 16px}.pc .ft a{font:700 13px var(--f-body);color:var(--kp-indigo);text-decoration:none;display:inline-flex;gap:6px;align-items:center;border-bottom:2px solid var(--kp-sign);padding-bottom:1px}.pc .ft a:hover{background:var(--kp-sign)}
.emp{padding:40px;text-align:center;color:var(--kp-muted);background:#fff;border:1px dashed var(--kp-line-2);border-radius:20px}
.nt{margin-top:34px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--kp-line);border-radius:22px;padding:18px 22px}.nt p{flex:1;min-width:240px;color:var(--kp-muted);font-size:14px}.nt b{color:var(--kp-ink)}
.lb{position:fixed;inset:0;z-index:3000;background:rgba(14,13,44,.78);display:none;place-items:center;padding:16px}.lb.on{display:grid}
.lb-c{background:#fff;border-radius:26px;overflow:hidden;max-width:820px;width:100%;display:grid;grid-template-columns:minmax(200px,42%) 1fr;position:relative}
.lb-c img{width:100%;height:100%;object-fit:cover;object-position:center 12%;min-height:300px;display:block}
.lb-t{padding:34px 30px;display:grid;align-content:center;gap:8px}.lb-t small{color:var(--kp-muted);font-weight:700}.lb-t h3{font:800 26px/1.4 var(--f-display);color:var(--kp-indigo)}.lb-t p{font-size:15px}
.lb-x{position:absolute;top:12px;inset-inline-end:12px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2);font-size:22px;cursor:pointer;z-index:2}
@media(max-width:820px){.sp{grid-template-columns:1fr}.sp .im{min-height:300px}.sp .tx{padding:24px}.lb-c{grid-template-columns:1fr}.lb-c img{min-height:0;height:300px}.bt .q{max-width:none;margin-inline-start:0;flex-basis:100%}}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:12px}.pc h3{font-size:15px}.pc .bd{padding:12px 12px 4px}.pc .ft{padding:8px 12px 12px}.nopic{font-size:44px}}
@media(prefers-reduced-motion:reduce){.pc{opacity:1;translate:none;transition:none}}
</style>

<div class="kp-hero"><div class="w ph">
  <div class="kp-tag">عن الشركة</div>
  <h1>مجلس الإدارة والإدارة التنفيذية</h1>
  <p>من يقود الشركة اليوم. تُحدَّث هذه الصفحة مع كل قرار تنظيمي جديد.</p>
</div></div>

<main><div class="w">
  <div class="bt">
    <div class="seg2" role="tablist" aria-label="القسم"><button type="button" data-t="b" class="on">مجلس الإدارة <em class="num" id="nB">0</em></button><button type="button" data-t="e">الإدارة التنفيذية <em class="num" id="nE">0</em></button></div>
    <div class="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.500"/><path d="m16 16 4 4"/></svg><input id="bdQ" type="search" placeholder="ابحث بالاسم أو المنصب…" autocomplete="off" aria-label="بحث"></div>
  </div>
  <div id="bdSp"></div>
  <div class="grid" id="bdGrid"></div>
  <div class="nt"><p><b>الهيكل التنظيمي:</b> اطّلع على مخطط الشركة الكامل ومن يتبع من، وابحث عن أي إدارة.</p><a class="btn y" href="KPTC_OrgStructure.html">عرض الهيكل التنظيمي</a></div>
</div></main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="بطاقة الشخص"><div class="lb-c"><button class="lb-x" type="button" data-close aria-label="إغلاق">×</button><img id="lbI" alt=""><div class="lb-t"><small id="lbS"></small><h3 id="lbN"></h3><p id="lbT"></p><a class="btn o sm" id="lbA" href="KPTC_OrgStructure.html" style="justify-self:start;margin-top:8px">موقعه في الهيكل التنظيمي</a></div></div></div>

<script>
(function(){
  /* people are data (studio: الهيكل التنظيمي) and change with the company's decisions */
  var K = window.KPTC, E = K.esc, tab = 'b', q = '', LIST = {b: [], e: []};
  function root(){ return K.org().units.filter(function(u){ return !u.p; })[0]; }
  function pick(){
    var o = K.org(), r = root();
    LIST.b = o.board.map(function(b){ var u = o.units.filter(function(x){ return x.ref === b.id; })[0]; return {img: K.orgImg(b), n: b.n, t: b.t, unit: u ? u.id : (r ? r.id : ''), uname: u ? u.n : '', since: b.since || ''}; });
    var out = []; (function walk(id){ K.kids(id).forEach(function(u){ if (u.ex){ var p = K.orgPerson(u); if (p && p.n && !u.vacant) out.push({img: K.orgImg(p), n: p.n, t: p.t || u.n, unit: u.id, uname: u.n, since: p.since || ''}); } walk(u.id); }); })(r ? r.id : '');
    LIST.e = out;
  }
  var ini = function(n){ return E(String(n).replace(/^[^\/]*\/\s*/, '').charAt(0)); };
  var img = function(p){ return p.img ? '<img src="' + E(p.img) + '" alt="' + E(p.n) + '" loading="lazy">' : '<span class="nopic">' + ini(p.n) + '</span>'; };
  var norm = function(s){ return String(s || '').replace(/[ً-ٟـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي'); };
  var io = 'IntersectionObserver' in window ? new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting){ setTimeout(function(){ e.target.classList.add('in'); }, e.target.__d || 0); io.unobserve(e.target); } }); }, {threshold: .1}) : null;
  function draw(){
    pick(); var t = norm(q).trim(), L = LIST[tab].filter(function(p){ return !t || norm(p.n + ' ' + p.t + ' ' + p.uname).indexOf(t) > -1; });
    document.getElementById('nB').textContent = LIST.b.length; document.getElementById('nE').textContent = LIST.e.length;
    var sp = document.getElementById('bdSp'), grid = document.getElementById('bdGrid'), first = !t && L[0] ? L[0] : null, rest = first ? L.slice(1) : L;
    sp.innerHTML = first ? '<div class="sp"><div class="im">' + img(first) + '</div><div class="tx"><span class="rl">' + E(first.t) + '</span><h2>' + E(first.n) + '</h2>' + (first.uname && tab === 'e' ? '<p>يقود: ' + E(first.uname) + '</p>' : '') + (first.since ? '<p>منذ ' + E(K.date(first.since)) + '</p>' : '') + '<div class="ac"><a class="btn y sm" data-org="' + first.unit + '" href="KPTC_OrgStructure.html">موقعه في الهيكل التنظيمي</a></div></div></div>' : '';
    grid.innerHTML = rest.length || first ? rest.map(function(p, i){ return '<article class="pc"><button type="button" class="im" data-i="' + L.indexOf(p) + '" aria-label="' + E(p.n) + '">' + img(p) + '</button><div class="bd"><h3>' + E(p.n) + '</h3><div class="t">' + E(p.t) + '</div>' + (p.uname && p.uname !== p.t ? '<div class="u">' + E(p.uname) + '</div>' : '') + '</div><div class="ft"><a data-org="' + p.unit + '" href="KPTC_OrgStructure.html">في الهيكل التنظيمي ←</a></div></article>'; }).join('') : '<div class="emp" style="grid-column:1/-1">لا نتائج مطابقة.</div>';
    [].forEach.call(grid.querySelectorAll('.pc'), function(c, k){ if (io){ c.__d = (k % 5) * 70; io.observe(c); } else c.classList.add('in'); });
    draw.cur = L;
  }
  [].forEach.call(document.querySelectorAll('.seg2 button'), function(b){ b.onclick = function(){ tab = b.getAttribute('data-t'); [].forEach.call(document.querySelectorAll('.seg2 button'), function(x){ x.classList.toggle('on', x === b); }); draw(); }; });
  document.getElementById('bdQ').addEventListener('input', function(){ q = this.value; draw(); });
  var lb = document.getElementById('lb');
  document.addEventListener('click', function(e){
    var a = e.target.closest('[data-org]'); if (a){ try { sessionStorage.setItem('kptc.orgFocus', a.getAttribute('data-org')); } catch(x){} return; }
    var c = e.target.closest('.pc .im'); if (c){ var p = (draw.cur || [])[+c.getAttribute('data-i')]; if (!p) return; var im = document.getElementById('lbI'); if (p.img){ im.src = p.img; im.style.display = ''; } else im.style.display = 'none'; im.alt = p.n; document.getElementById('lbN').textContent = p.n; document.getElementById('lbT').textContent = p.t; document.getElementById('lbS').textContent = tab === 'b' ? 'مجلس الإدارة' : 'الإدارة التنفيذية'; document.getElementById('lbA').setAttribute('data-org', p.unit); lb.classList.add('on'); return; }
    if (e.target === lb || e.target.closest('[data-close]')) lb.classList.remove('on');
  });
  document.getElementById('lbA').addEventListener('click', function(){ try { sessionStorage.setItem('kptc.orgFocus', this.getAttribute('data-org') || ''); } catch(x){} });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') lb.classList.remove('on'); });
  draw(); K.onChange(draw);
})();
</script>
